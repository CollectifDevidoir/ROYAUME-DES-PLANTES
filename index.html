tylon":{"statut":"Nom accepté : Cynodon dactylon (L.) Pers. Synonymes : Panicum dactylon L., Digitaria dactylon (L.) Scop., Capriola dactylon (L.) Kuntze (TAXREF, VASCAN)","port":"Graminée vivace rampante, 10 à 40 cm, ramifiée, formant un tapis par stolons et rhizomes","feuilles":"Courtes et raides, gris-vert, 2 à 4 mm de large ; ligule d'environ 0,5 mm faite d'une touffe de poils","fleurs":"Inflorescence de 3 à 5 épis (2,5 à 5 cm) insérés au même point ; épillets d'environ 2 mm, uniflores, sur 2 rangs, à 2 glumes égales, sans arête, souvent violets","floraison":"7 à 9","milieu":"Bords de chemins, entre les pavés, friches, en situation chaude","confusions":"Digitaires (Digitaria) : épis ne partant pas tous du même point (Flora Helvetica le donne comme critère de distinction)","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/cynodon-dactylon.html ; TAXREF (MNHN) : https://taxref.mnhn.fr/taxref-web/taxa/94974 ; VASCAN : https://data.canadensys.net/vascan/taxon/7514 ; Tropical Forages (feuille, ligule) : https://apps.lucidcentral.org/tropical_forages/pdf/cynodon_dactylon.pdf"},"Sesleria caerulea":{"statut":"Nom accepté : Sesleria caerulea (L.) Ard. Sesleria albicans : traitée comme synonyme par iFlora, comme espèce distincte par Kew GrassBase","port":"Graminée vivace en touffe dense, légèrement rhizomateuse, 10 à 50 cm","feuilles":"1 à 5 mm de large, 5 à 40 cm de long, face supérieure glauque, nervure médiane saillante, pointe en capuchon","fleurs":"Panicule capitulée dense ovoïde à globuleuse, 1 à 3 cm, souvent violacée, 2 bractées stériles dessous ; épillets de 4 à 7 mm","floraison":"Mars à mai","milieu":"Pâturages calcaires frais à humides, tourbières, pelouses alpines calcaires (Blaugrashalden) sur calcaire ou dolomie","confusions":"Seslérie argentée (S. albicans) : feuille supérieure d'environ 1 cm, panicule ovale dense ; cette distinction dépend du traitement taxonomique choisi","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/sesleria-caerulea.html ; Kew GrassBase : https://www.kew.org/data/grasses-db/www/imp09319.htm ; Flora of North America : https://floranorthamerica.org/Sesleria_caerulea ; iFlora : https://www.i-flora.com/en/fact-sheets/search-for-species/art/show/sesleria-caerulea.html ; Info Flora, habitat : https://www.infoflora.ch/en/habitats/typoch/4.3.1-blaugrashalde.html"},"Luzula nivea":{"statut":"Nom accepté : Luzula nivea (L.) DC. (accepté par GBIF ; à confirmer sur POWO). Synonymes : Juncus niveus, Juncoides nivea","port":"Vivace en touffe lâche persistante, 40 à 60 cm en fleur","feuilles":"Étroites, bordées de poils blancs","fleurs":"Glomérules de petites fleurs blanches au sommet de longues tiges","floraison":"6 à 7","usage":"Couvre-sol de mi-ombre à ombre, bordures, sous les arbres","entretien":"Sol frais, humifère, drainé ; supprimer le feuillage abîmé au début du printemps ; diviser les touffes trop denses ; se ressème facilement","sources":"RHS Plants : https://www.rhsplants.co.uk/plants/_/luzula-nivea/classid.2000037059/ ; RHS Plants (fiche culture) : https://www.rhsplants.co.uk/search/_/search.-/vid.278/vid.163/"}};

function checkBackup(o){
  const obj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x),num=x=>typeof x==='number'&&isFinite(x);
  if(!obj(o))return "Ce texte n'est pas une sauvegarde de l'appli.";
  if(!obj(o.sp))return 'Sauvegarde incomplète : la progression des plantes est absente.';
  for(const[k,p]of Object.entries(o.sp)){
    if(!obj(p)||!Number.isInteger(p.b)||p.b<0||p.b>6||!num(p.s)||p.s<0||!num(p.e)||p.e<0||(p.d!==undefined&&!num(p.d)))return 'Sauvegarde abîmée : données incorrectes pour « '+k.slice(0,40)+' ».';
  }
  if(o.hist!==undefined){if(!obj(o.hist))return "Sauvegarde abîmée : l'historique est illisible.";for(const h of Object.values(o.hist))if(!obj(h)||!num(h.n)||!num(h.ok))return "Sauvegarde abîmée : l'historique est illisible."}
  for(const k of['m','cf','ho','fd','day','set'])if(o[k]!==undefined&&!obj(o[k]))return 'Sauvegarde abîmée : la rubrique « '+k+' » est illisible.';
  if(o.tm!==undefined&&!(obj(o.tm)&&Array.isArray(o.tm.l)&&o.tm.l.every(x=>typeof x==='string')))return 'Sauvegarde abîmée : la liste des erreurs est illisible.';
  if(o.ses!==undefined&&!Array.isArray(o.ses))return 'Sauvegarde abîmée : les séances sont illisibles.';
  for(const k of['best','streak'])if(o[k]!==undefined&&!num(o[k]))return 'Sauvegarde abîmée : la valeur « '+k+' » est illisible.';
  return '';
}

elle et pignons comestibles ; typique des littoraux méditerranéens.","Pinus sylvestris":"Le pin le plus répandu d'Europe ; écorce orangée dans la partie haute du tronc, rustique et peu exigeant.","Pinus nigra":"Très résistant au froid, à la sécheresse et au calcaire ; souvent planté en reboisement.","Taxus baccata":"Il vit des siècles et se taille en haie ou en formes ; toutes les parties sont toxiques sauf l'arille rouge.","Cupressus sempervirens":"Arbre-colonne de Provence qui protège du vent.","Sequoiadendron giganteum":"L'un des arbres les plus volumineux du monde ; son écorce épaisse le protège du feu.","Cornus sanguinea":"Rameaux rouge sang en hiver ; utile en haie champêtre.","Corylus avellana":"Ses chatons mâles sont l'une des premières floraisons de l'année.","Crataegus monogyna":"Aubépine : haie épineuse aux fleurs blanches en mai et petites baies rouges ; un seul style par fleur.","Euonymus europaeus":"Fusain d'Europe : fruits roses à graines orange très décoratifs, mais toxiques.","Ligustrum vulgare":"Troène commun : haie champêtre aux fleurs blanches odorantes ; baies noires toxiques.","Viburnum tinus":"Floraison en plein hiver et baies bleu métallique ; persistant.","Buxus sempervirens":"Taillé en haies et topiaires depuis l'Antiquité ; menacé par la pyrale du buis et le Cylindrocladium.","Sambucus nigra":"Sureau noir : fleurs blanches en ombelles parfumées et baies noires à cuire ; haies et lisières.","Laurus nobilis":"Le laurier-sauce des cuisines ; arbuste dioïque, dont les rameaux couronnaient les vainqueurs dans l'Antiquité.","Nerium oleander":"Laurier-rose : floraison estivale rose ou blanche ; toutes ses parties sont très toxiques.","Prunus laurocerasus":"Grande haie persistante très utilisée ; feuilles et noyaux sont toxiques.","Ilex aquifolium":"Seuls les pieds femelles portent des baies rouges, à condition qu'un mâle soit proche.","Hydrangea macrophylla":"La couleur des fleurs dépend du sol : bleues en sol acide, roses en sol neutre ou calcai ux ; croissance lente, très longévif.","Olea europaea":"Symbole méditerranéen qui peut vivre plusieurs siècles ; il craint les gels durables.","Ostrya carpinifolia":"Charme-houblon : fruits en cônes comme le houblon, feuilles de charme ; sols calcaires secs.","Paulownia tomentosa":"Paulownia : floraison violette très parfumée avant les feuilles ; croît très vite mais gèle parfois.","Phoenix canariensis":"Palmier des Canaries : tronc épais et palmes en plumes ; dattes non comestibles.","Picea abies":"Sapin de Noël traditionnel, aux cônes pendants.","Picea pungens":"La forme bleue ('Glauca') est la plus connue ; aiguilles piquantes.","Pinus halepensis":"Pin des garrigues du littoral, résistant à la sécheresse mais sensible aux grands froids.","Pinus strobus":"Aiguilles souples et fines réunies par cinq ; pin américain élancé à croissance rapide.","Pinus pinaster":"Pin des Landes, planté pour sa résine et son bois ; il aime les sols sableux et acides.","Platanus orientalis":"Platane d'Orient : feuilles profondément découpées ; très grand arbre qui vit longtemps.","Populus alba":"Peuplier blanc : feuilles blanches feutrées dessous ; drageonne beaucoup.","Populus tremula":"Le tremble : le pétiole aplati fait frissonner les feuilles au moindre vent.","Prunus cerasifera":"Le myrobolan fleurit très tôt ; la variété 'Pissardii' est connue pour son feuillage pourpre.","Prunus padus":"Merisier à grappes : ses fleurs blanches en grappes pendantes parfument le printemps ; fruits noirs amers.","Prunus serrulata":"Cerisier du Japon aux fleurs doubles roses ou blanches ; il ne donne pas de fruits intéressants.","Prunus × yedoensis":"Le cerisier de Yoshino, célèbre pour les fêtes de floraison au Japon : fleurs blanc rosé avant les feuilles.","Prunus dulcis":"Floraison très précoce, dès la fin de l'hiver, souvent atteinte par le gel.","Pyrus calleryana":"Poirier de Chine : floraison blanche abondante, très planté en ville ; la variété 'Chanticleer' est étroite.","Pyrus communis":"Poi ksiae":"Rosier de Banks : grimpant presque sans épines, floraison en grappes jaunes ou blanches au printemps ; craint le gel fort.","Trachelospermum jasminoides":"Jasmin étoilé : fleurs blanches en étoile très parfumées, feuilles persistantes luisantes.","Vitis vinifera":"La vigne cultivée : milliers de cépages ; pergolas et vignobles.","Wisteria floribunda":"Glycine du Japon : longues grappes qui s'ouvrent progressivement depuis la base, jusqu'à 50 cm.","Arundo donax":"Canne de Provence : tiges de 3 à 5 m, vigoureux, utilisée pour les anches d'instruments ; envahissante en bord d'eau.","Calamagrostis × acutiflora":"Calamagrostis 'Karl Foerster' : port dressé très régulier, épis plumeux dès juin.","Carex pendula":"Grande laîche aux épis pendants, souvent en sous-bois frais ; elle se ressème facilement près des fossés.","Carex oshimensis":"Laîche persistante utilisée en couvre-sol et en bordure ; la variété 'Evergold' est panachée de jaune.","Cortaderia selloana":"Herbe de la pampa : très grand plumeau argenté ; envahissante dans certaines régions.","Deschampsia cespitosa":"Canche cespiteuse : panicules fines dorées qui brillent ; sols frais, même ombragés.","Elymus magellanicus":"Élyme bleu : touffe de feuilles bleu argenté, qui garde sa couleur toute l'année.","Fargesia murielae":"Bambou parapluie : touffe non traçante aux chaumes arqués ; floraison rare.","Festuca glauca":"Fétuque bleue : petites touffes bleu argenté, plante de rocaille.","Hakonechloa macra":"Herbe du Japon : feuilles rubanées retombantes en cascade, couleur jaune à l'automne.","Imperata cylindrica":"Herbe à sang japonaise : le cultivar 'Red Baron' a des feuilles rouges ; rhizomes à surveiller.","Juncus effusus":"Jonc épars : tiges vertes rondes et lisses, dressées en touffes ; milieux humides.","Luzula sylvatica":"Luzule des bois : touffe de feuilles persistantes poilues, très bon couvre-sol d'ombre.","Melica ciliata":"Mélique ciliée : épis argentés très soyeux, plante des pelouses sèches.","Moli const FE=()=>Object.keys(FI).filter(f=>S.filter(s=>FAM[gen(s[0])]===f).length>=5).sort();
const famDay=()=>{const e=FE();return e[Math.floor(new Date(today()+'T12:00:00').getTime()/864e5)%e.length]};
const frFam=f=>FI[f]?FI[f][0].replace(' (',', ').replace(')',''):'';
const famHue=f=>[...f].reduce((a,c)=>a+c.charCodeAt(0)*37,0)%360;
const tileImg=async(e,k=0)=>{const s=S.find(x=>x[0]===e.dataset.l);if(!s||e.querySelector('img'))return;let im=null;try{im=await getImg(s)}catch(x){}
  if(im&&im.src){e.classList.remove('no');const i=new Image();i.referrerPolicy='no-referrer';i.alt='';i.onerror=()=>{i.remove();e.classList.add('no')};i.src=im.src;e.prepend(i)}
  else{e.classList.add('no');if(k<3){if(cache[s[0]]===null)delete cache[s[0]];setTimeout(()=>{if(e.isConnected)tileImg(e,k+1)},3000*(k+1))}}};
function openFamily(f){
  const d=$('fam'),z=$('fz'),sp=S.filter(s=>FAM[gen(s[0])]===f),own=s=>(st.sp[s[0]]||{b:0}).b>=4,info=FI[f],got=sp.filter(own).length;
  famCur=f;shTok++;st.fd={d:today()};save();stats();
  const nx='<button class="fnx" type="button">Suivant '+ico('chev-r','ic-in')+'</button>';

// Haut le plus élevé permis pour la fiche : sous la photo en QCM et en écriture ; ailleurs (4 photos), presque tout l'écran
function shTop(){const H=typeof innerHeight==='number'?innerHeight:800,p=$('pic');
  if(!pvSet&&p&&!p.hidden&&p.getClientRects().length){const lim=Math.round(p.getBoundingClientRect().bottom)+8;if(H-lim>=180)return lim}

// Carte d'exercice replacée d'un coup sous l'en-tête (même position que pendant la question)
function snapQc(){const e=$('qc');if(!e||$('quiz').hidden)return;const h=($('top')&&$('top').offsetHeight)||56;window.scrollTo(0,Math.max(0,e.getBoundingClientRect().top+(window.pageYOffset||0)-h-4))}

const shDesk=()=>typeof matchMedia==='function'&&matchMedia('(min-width:900px)').matches&&!pvSet&&!$('pic').hidden;

function fitSh(){const s=$('sh');if(!s)return;
  const desk=!s.hidden&&shDesk();s.classList.toggle('desk',desk);
  if(desk){const H=innerHeight,pr=$('pic').getBoundingClientRect(),qr=$('qc').getBoundingClientRect(),hh=(($('top')&&$('top').offsetHeight)||56),full=s.classList.contains('full'),t=Math.round(full?hh+8:pr.top);
    s.style.left=Math.round(pr.right+24)+'px';s.style.right=Math.round(innerWidth-qr.right+12)+'px';s.style.top=t+'px';
    if(s.classList.contains('peek')){s.style.maxHeight='';return}
    s.style.maxHeight='none';const b=$('shb'),need=s.offsetHeight-b.clientHeight+b.scrollHeight;s.style.maxHeight=Math.max(160,Math.min(full?1e4:need+4,H-t-16))+'px';return}
  s.style.right='';s.style.top='';
  const side=!s.hidden&&shSide();s.classList.toggle('side',side);s.style.left=side?Math.round($('pic').getBoundingClientRect().right+8)+'px':'';
  if(s.hidden||s.classList.contains('peek')||s.classList.contains('full')){s.style.maxHeight='';return}
  const H=typeof innerHeight==='number'?innerHeight:800;
  if(side){s.style.maxHeight=(H-(($('top')&&$('top').offsetHeight)||56)-8)+'px';return}
  s.style.maxHeight='none';const b=$('shb'),need=s.offsetHeight-b.clientHeight+b.scrollHeight;s.style.maxHeight=Math.max(120,Math.min(need+4,H-shTop()))+'px'}

function veilHole(){
  const v=$('veil');if(!v)return;
  const on=document.body.classList.contains('hs')&&!document.querySelector('dialog[open]')&&!$('sh').classList.contains('full')&&!$('opts').classList.contains('ph');

  if(!on||!el||el.hidden||!el.offsetParent){v.style.clipPath='';return}

}
