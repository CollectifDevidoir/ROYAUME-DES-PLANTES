<style>:root{--bg1:#d3e3c2;--bg2:#eaf2df;--t1:#3d5c3a;--t2:#4f7d47;--ry:.6;--fg:#14281a;--card:#fbfdf9;--ac:#2f6b3f;--ac2:#8ab77a;--ok:#1f7a45;--ko:#b3392e;--mu:#5b6d5f;--bd:#c9dbc4;--vt:#fff}
@media(prefers-color-scheme:dark){:root{--bg1:#0a140d;--bg2:#15261b;--t1:#050b06;--t2:#1c3a24;--ry:.15;--fg:#e3eee4;--card:#1a2a1e;--ac:#8fcf9f;--ac2:#3d6b48;--ok:#7bd192;--ko:#f09a90;--mu:#98ab9c;--bd:#2c4132;--vt:#0b1a10}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.5 system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2))}
html{-webkit-text-size-adjust:100%;background:var(--bg1)}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.tf,.tn{fill:var(--t1)}
/* canopée du décor (haut de l'écran) : feuillage en transparence, jamais noir */
.cn1{fill:var(--t2);opacity:.22}.cn2{fill:var(--t2);opacity:.3}
.fr{fill:var(--t2);opacity:.55}
.ray{animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{from{opacity:calc(var(--ry)*.5)}to{opacity:var(--ry)}}
@media(prefers-reduced-motion:reduce){.ray{animation:none;opacity:var(--ry)}}
main{max-width:600px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 190px;position:relative;z-index:1}
h1{font:italic 700 1.3rem Georgia,serif;margin:0 0 6px;color:var(--ac)}
.rank{display:flex;gap:12px;align-items:center}
.rank>div:last-child{min-width:0}
.medal{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.medal span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem}
#rn{font:700 1.05rem Georgia,serif}
.rs{color:var(--mu);font-size:.82rem;margin:1px 0 5px}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:99px;transition:width .5s}
.tabs{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));display:flex;gap:4px;background:var(--card);background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--bd);box-shadow:0 8px 24px -8px rgba(10,40,20,.5)}
.tabs button{flex:1;border:0;background:none;color:var(--mu);cursor:pointer}
.tabs button[aria-current=true]{background:var(--ac);color:var(--card)}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--card)}
.card{background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1px solid var(--bd);padding:12px;box-shadow:0 6px 24px -12px rgba(20,60,30,.4);margin-bottom:12px}
.pic{aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;background:var(--bg2);color:var(--mu)}
.pic img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pic.pop{animation:pop .6s}
@keyframes pop{40%{box-shadow:0 0 0 7px var(--ok)}}
@media(prefers-reduced-motion:reduce){.pic.pop{animation:none}}
#q{font:italic 1.05rem Georgia,serif;margin:12px 2px 8px;color:var(--mu)}
.opts{display:grid;gap:8px}
.opts>button{display:flex;gap:10px;align-items:center;font:italic 1.05rem Georgia,serif;text-align:left;padding:11px 12px;background:var(--bg1);color:var(--fg);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer}
.opts>button::before{content:attr(data-n);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--card);font:600 .8rem system-ui;display:grid;place-items:center}
.opts>button:hover:not(:disabled){border-color:var(--ac)}
.opts .ok{border-color:var(--ok);background:var(--card);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.opts .ko{border-color:var(--ko);background:var(--card);background:color-mix(in srgb,var(--ko) 22%,var(--card))}
#q-form{display:flex;gap:8px}
#q-input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;color:#14281a;font:italic 1.05rem Georgia,serif}
#q-form button,#next{font:600 1rem system-ui;padding:10px 18px;border:0;border-radius:12px;background:var(--ac);color:var(--card);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#fb{margin-top:10px;min-height:2em}
#next{margin-top:8px}
.v{display:inline-block;border-radius:99px;font-weight:700;color:var(--vt)}
.v.y{background:var(--ok)}
.v.n{background:var(--ko)}
#ex h3{font:700 .85rem system-ui;color:var(--ac);margin:12px 0 2px}
#ex h3:first-child{margin-top:0}
#ex p{margin:0 0 6px;font-size:.92rem}
small a,#ex a{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
td:first-child{font-family:Georgia,serif;font-style:italic}
.reset{margin-top:16px;background:none;border:1px solid var(--bd);color:var(--mu);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.xt{display:flex;gap:6px;margin-bottom:10px}
.xt button{flex:1;padding:7px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--mu);font:600 .9rem system-ui;cursor:pointer}

.cf{display:flex;gap:10px;align-items:flex-start}
.cf img{flex:none;width:104px;height:78px;object-fit:cover;border-radius:10px}
.help{position:absolute;top:calc(50% - 13px);width:26px;height:26px;border:0;background:var(--ac);color:var(--card);font:700 .95rem Georgia,serif;cursor:pointer;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transform:rotate(-8deg);transition:transform .2s}

dialog{border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--fg);width:min(460px,92vw);padding:18px}

#dx{margin-top:14px;width:100%;font:600 1rem system-ui;padding:10px;border:0;border-radius:12px;background:var(--ac);color:var(--card);cursor:pointer}
.pic{position:relative}
@keyframes sk{to{opacity:.5}}
@media(prefers-reduced-motion:reduce){.pic.sk{animation:none}}
.car{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always;min-height:100%}
.lb,.cr{position:absolute;top:8px;background:rgba(20,40,25,.66);color:#fff;font-size:.75rem;padding:2px 9px;border-radius:99px;text-decoration:none}
.lb{left:8px}
.cr{right:8px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}

.dots i.on{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.ar{position:absolute;top:50%;translate:0 -50%;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.78);color:#14281a;font-size:1.3rem;cursor:pointer}
.ar.l{left:8px}
.ar.r{right:8px}
@media(hover:none){.ar{display:none}}
.pic.one .ar,.pic.one .dots{display:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;background:var(--ac);color:var(--card);padding:10px 18px;border-radius:99px;font-weight:700;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.hh{font:700 1rem Georgia,serif;margin:0 0 6px;color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
@supports not (aspect-ratio:1){.pic{height:66vw;max-height:420px}}
#next{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));z-index:6;margin:0;padding:16px;font-size:1.1rem;box-shadow:0 10px 28px -8px rgba(10,40,20,.6)}
.card.in{animation:qin .28s ease-out}
@keyframes qin{from{transform:translateX(36px);opacity:0}}

#qc,#ex,#fin{touch-action:pan-y}
.chips.o button{font-size:.8rem;padding:4px 9px}
.qk{margin:0 0 6px;padding-left:18px;font-size:.92rem}
.qk li{margin:1px 0}
.hh.big{font-size:2rem;margin:0}
.col{display:grid;gap:8px;margin-top:14px}
.col button,.cfr button{font:600 .95rem system-ui;padding:11px;border:0;border-radius:12px;background:var(--ac);color:var(--card);cursor:pointer}
.col button:last-child{background:none;color:var(--ac);border:1.5px solid var(--ac)}
.kp{display:flex;gap:8px;text-align:center;margin-bottom:12px}
.kp div{flex:1;min-width:0;line-height:1.3;font-size:.75rem;color:var(--mu);background:var(--bg1);border-radius:12px;padding:10px 4px}
.kp b{display:block;font:700 1.5rem Georgia,serif;color:var(--ac)}
.hist{display:flex;align-items:flex-end;gap:3px;height:80px}
.hist div{flex:1;height:100%;display:flex;align-items:flex-end;background:var(--bg1);border-radius:4px}
.hist i{display:block;width:100%;min-height:3px;border-radius:4px;background:var(--ac)}
.cfr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.cfr button{padding:6px 10px;font-size:.8rem}
.lo{color:var(--ko)}
.hi{color:var(--ok)}
.chips{flex-wrap:wrap}
.chips button{flex:1 1 auto;padding:6px 8px;font-size:.8rem;text-align:center}
.ring{--g:0%;flex:none;width:60px;height:60px;border-radius:50%;background:radial-gradient(closest-side,var(--card) 74%,transparent 76%),conic-gradient(var(--ac) var(--g),var(--bd) 0);display:grid;place-content:center;text-align:center;line-height:1}
.ring b{font:700 1.3rem Georgia,serif}
.ring small{font-size:.7rem;color:var(--mu)}
.ring.done{background:radial-gradient(closest-side,var(--card) 74%,transparent 76%),conic-gradient(#d4a72c 100%,#d4a72c 0)}
.mini{font:600 .82rem system-ui;padding:6px 12px;border:1.5px solid var(--ac);border-radius:99px;background:none;color:var(--ac);cursor:pointer}
.opts>button{min-height:54px;font-size:1.1rem;transition:transform .12s,border-color .15s}
.opts>button:active:not(:disabled){transform:scale(.98)}
#ex details{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}
#ex summary{cursor:pointer;font:600 .9rem system-ui;color:var(--ac)}
#ex details p{margin:6px 0 0}
.wk{display:inline-block;margin-top:8px;font-size:.82rem}
#ex .qk{font-size:1rem}
.typing .pic{aspect-ratio:auto;height:32vh}
.pic.ans{cursor:zoom-in}
.opts.ph{grid-template-columns:1fr 1fr}
.opts.ph>button{position:relative;padding:0;min-height:0;aspect-ratio:4/3;overflow:hidden;background:var(--bg2)}
.opts.ph>button::before{position:absolute;top:6px;left:6px;z-index:2}
.opts.ph>button img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.opts.ph .cap{display:none;position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(10,25,15,.88));color:#fff;font:italic .85rem Georgia,serif;text-align:center}
.opts.ph.rv .cap{display:block}
.opts.ph .ok{outline:5px solid var(--ok);outline-offset:-5px}
.opts.ph .ko{outline:5px solid var(--ko);outline-offset:-5px}
.opts.ph>button:disabled:not(.ok){opacity:.8}
#q.pv .pvn{display:block;font:italic 700 1.45rem Georgia,serif;color:var(--fg);margin:2px 0}
.fam{font-size:.85rem;color:var(--mu);margin:0 0 8px}
.fam:empty{display:none}
#crd{font-size:.8rem;color:var(--mu)}
#crd p{margin:0 0 3px}
#zm{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:rgba(10,20,12,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#zm img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:12px}
#q-form{flex-wrap:wrap}
.jk{flex-basis:100%;margin-top:6px;border-radius:12px;font-size:.9rem}
@keyframes fi{from{opacity:0}}

.rku{position:fixed;inset:0;z-index:98;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(10,30,15,.82);color:#fff;text-align:center;animation:fi .3s;padding:16px;overflow:auto}
.rku .pl{font-size:3.6rem;height:120px;display:flex;align-items:flex-end}

.rku h2,.rku p{margin:0}
.pkg{display:grid;gap:6px;margin-top:10px}
.pk{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:#dfe7d6}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk b{position:absolute;left:0;right:0;bottom:0;font:600 .58rem system-ui;background:rgba(10,25,15,.78);color:#fff;padding:2px;text-align:center;line-height:1.15}
.pk.no{display:flex;align-items:center;justify-content:center;color:#a3b09a;font-size:1.3rem;background:#e9eee3}
.fch{width:min(640px,100vw);max-width:100vw;max-height:92vh;margin:auto auto 0;padding:0;border:0;border-radius:20px 20px 0 0;background:var(--card);color:var(--fg)}
.fch[open]{display:flex;flex-direction:column}
.fch::backdrop{background:rgba(10,30,15,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.fhd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);font:700 1.1rem Georgia,serif}
.fhd button{flex:none;border:0;background:var(--bg1);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;color:var(--fg)}
#fcb{overflow:auto;padding:12px 14px;flex:1}
#fcb h3{font:700 1rem Georgia,serif;color:var(--ac);margin:14px 0 4px}
#fcf{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}

.tg{display:inline-block;margin-bottom:4px;padding:2px 9px;border-radius:99px;font:700 .75rem system-ui;color:var(--vt)}

.tg.ko{background:var(--ko)}
.fph{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:6px 0}

.fph img:first-child{grid-column:1/-1;aspect-ratio:4/3}
.key{background:var(--bg1);border-left:4px solid var(--ko);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.key p{margin:4px 0 0}
.cmp{width:100%;border-collapse:collapse;font-size:.85rem;margin:6px 0}

.cmp th{color:var(--ac);width:22%}
.cmp th em{font-weight:600}
.cmp td:first-child{font-family:inherit;font-style:normal}
.na{color:var(--mu);font-size:.8rem}
.ld{color:var(--mu)}
.big{width:100%;font:600 1rem system-ui;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--card);cursor:pointer}

.hc{padding:0}

.hc>summary .bar{margin-top:6px}

button,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tabs{border-radius:26px;padding:4px}

.card{border-radius:20px}
.pic{border-radius:14px}
#fb{font-size:1.05rem;padding:2px 2px 0}
.v{font-size:.95rem;padding:2px 12px}
.rk .bdg{font-size:4rem}
.rk .bdg span{animation:bob 1.6s ease-in-out 1s infinite alternate}
@keyframes pop2{from{transform:scale(.05) rotate(-60deg);opacity:0}}

.rk h2{margin-top:14px}
.rk .burst{position:absolute;left:50%;top:42%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,hsl(var(--h) 85% 65%/.6),transparent 65%);animation:bu 1.3s ease-out both}
@keyframes bu{from{transform:scale(.1);opacity:0}60%{opacity:1}to{transform:scale(1.2);opacity:.5}}
.rk .cf{position:absolute;left:50%;top:42%;background:var(--c);opacity:0;animation:cfa 1.5s ease-out forwards}

@media(prefers-reduced-motion:reduce){.rk .bdg,.rk .bdg span,.rk .burst,.rk .cf{animation:none}.rk .cf{display:none}}
#next,#ex{display:none!important}
.sh{position:fixed;left:0;right:0;margin:0 auto;width:min(640px,100vw);bottom:calc(74px + env(safe-area-inset-bottom));z-index:8;display:flex;flex-direction:column;height:auto;max-height:max(33vh,250px);background:var(--card);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -12px 32px -12px rgba(10,40,20,.5);transition:max-height .3s cubic-bezier(.2,.9,.3,1);animation:shin .32s ease-out}

.sld input::-moz-range-track{height:8px;background:transparent}
.sld input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--ac);border:3px solid var(--card);box-shadow:0 2px 6px rgba(10,40,20,.35)}
.sld input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ac);border:3px solid var(--card);box-shadow:0 2px 6px rgba(10,40,20,.35)}
.sld input:focus-visible{outline:3px solid var(--ac2);outline-offset:2px;border-radius:12px}
.tks{position:absolute;left:14px;right:14px;bottom:4px;height:18px;pointer-events:none}
.tks span{position:absolute;left:calc(var(--i)*100%);transform:translateX(-50%);font:600 12px system-ui;color:var(--mu)}
.tks span::before{content:'';position:absolute;left:50%;top:-9px;width:2px;height:5px;margin-left:-1px;border-radius:1px;background:var(--bd)}
.tks span.on{color:var(--ac);font-weight:800}
/* ===== Écriture : bouton d'indice sur la ligne de saisie ===== */
#q-form .qiw{order:1;flex:1;min-width:0;position:relative;display:flex}
#q-form .qiw #q-input{flex:1;width:100%}
/* joker : initiales du genre et de l'espèce, fixées à droite dans le champ, visibles même pendant la saisie */
.qini{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:3px 8px;border-radius:8px;background:#e2ecdc;color:#2f6b3f;font:italic 700 1rem Georgia,serif;letter-spacing:.03em;white-space:nowrap;pointer-events:none}
#q-form.hint #q-input{padding-right:72px}
#q-form .jk{order:2;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:54px;min-height:44px;margin:0;padding:0 9px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:700 .9rem system-ui}
#q-form .jk .tgi{width:22px;height:22px}
#q-form .jk .jkn{font:700 .85rem system-ui;color:var(--mu)}
#q-form .jk.usd{border-color:var(--ac);background:rgba(47,107,63,.1)}
#q-form .jk:disabled{opacity:.55}
#q-form .jk.usd:disabled{opacity:1}
#q-form>button:not(.jk){order:3}
#q-form .tyq{order:4}
