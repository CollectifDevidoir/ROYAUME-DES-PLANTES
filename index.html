Amérique du Sud. Jardins de ville et de cour (RHS)","entretien":"Plein soleil, sol frais mais drainé, acide à neutre ; semis au printemps ou à l'automne, division en début d'été","sources":"RHS : https://www.rhs.org.uk/plants/54735/wd/details"},"Imperata cylindrica":{"statut":"Le jeu vise le cultivar Imperata cylindrica 'Red Baron' (synonymes 'Rubra', Imperata cylindrica var. koenigii), forme rouge de l'espèce Imperata cylindrica (L.) Raeusch. (RHS, NC State)","port":"Graminée caduque en touffe lâche de 10 à 50 cm de haut et 10 à 50 cm de large, qui s'étend lentement par rhizomes","feuilles":"Linéaires, dressées, vertes à la base et rouge sang du milieu à la pointe (rouge de plus en plus vif en été et automne) ; bord dentelé à cristaux de silice ; cuivrées en dormance","fleurs":"Panicules argentées étroites en fin d'été, rares chez le cultivar","floraison":"8 à 9 (rare)","milieu":"Cultivar d'origine horticole, issu du Japon","confusions":"L'espèce typique, entièrement verte et haute de plus d'un mètre, est une adventice très envahissante par ses rhizomes (classée parmi les pires du monde par NC State, plante nuisible fédérale aux États-Unis). Le cultivar rouge peut revenir à cette forme verte","rusticite":"RHS H4 ; zone USDA 6 selon un arboretum","usage":"Bordures, rocailles, grands massifs de couleur, couvre-sol de sites difficiles (parkings, îlots de circulation selon un arboretum)","entretien":"Plein soleil pour la couleur rouge (elle s'atténue à l'ombre) ; sol frais mais très drainé l'hiver ; supprimer le feuillage mort au début du printemps ; division au printemps ; arracher dès l'apparition les pousses entièrement vertes","sources":"RHS : https://www.rhs.org.uk/plants/94352/imperata-cylindrica-rubra/details ; NC State, 'Rubra' : https://plants.ces.ncsu.edu/plants/imperata-cylindrica-rubra/common-name/japanese-blood-grass/ ; NC State, espèce : https://plants.ces.ncsu.edu/plants/imperata-cylindrica/common-name/japanese-blood-grass/ ; Morton Arboretum : https://mortonarb.org/plant-and-protect/trees-and-plants/red-cogongrass/ ; World Plants : https://www.worldplants.ca/display.php?id=2705"},"Melica ciliata":{"statut":"Nom accepté : Melica ciliata L. (Info Flora) ; nom français Mélique ciliée (MNHN, via e-FLORA-sys)","port":"Graminée vivace en touffe ou à courts rhizomes, 30 à 70 cm","feuilles":"2 à 3 mm de large (1 à 5 mm), 7 à 20 cm de long, gris-vert, enroulées ou planes à pointe enroulée, finement poilues ; ligule de 3 à 6 mm, obtuse ; gaines glabres","fleurs":"Panicule dense, cylindrique à lobée, 5 à 20 cm, couverte de longs poils soyeux ; épillets ovales de 4 à 8 mm, poilus, à une fleur fertile ; lemme à poils étalés de 3 à 4,5 mm","floraison":"5 à 6 (avril à juin)","milieu":"Rocailles, pelouses sèches, broussailles, lieux secs et pierreux","confusions":"Mélique de Transylvanie (Melica transsilvanica) : tiges souvent retombantes, feuilles le plus souvent planes à carène vive, gaines inférieures poilues et étalées, inflorescence dense dont l'axe est le plus souvent caché","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/melica-ciliata.html ; Info Flora, M. transsilvanica : https://www.infoflora.ch/en/flora/melica-transsilvanica.html ; iFlora : https://www.i-flora.com/en/fact-sheets/search-for-species/art/show/melica-ciliata.html ; Flora of Gibraltar : https://floraofgibraltar.myspecies.info/taxonomy/term/1628/descriptions ; e-FLORA-sys (nom français) : https://eflorasys.univ-lorraine.fr/index.php/en/species/view/137719"},"Schizachyrium scoparium":{"statut":"Nom accepté : Schizachyrium scoparium (Michx.) Nash. Synonyme : Andropogon scoparius","port":"Graminée vivace en touffe dressée, 60 à 120 cm de haut et 30 à 60 cm de large","feuilles":"Minces, plates, vert à bleu-vert, base teintée de bleu ; bronze à cuivre en automne","fleurs":"Racèmes de 2,5 à 7,5 cm sur rameaux ramifiés ; d'abord bronze-pourpre, puis fauves à blanc grisâtre et duveteux à maturité","floraison":"8 à 10 (graines persistant jusqu'en hiver)","milieu":"Prairies, clairières, collines sèches d'Amérique du Nord","rusticite":"Zones USDA 3 à 9","usage":"Prairies, massifs, rocailles, sols pauvres ; fixe les sols ; graines pour les oiseaux","entretien":"Plein soleil, sol drainé pauvre à moyen, sec à frais ; entretien faible ; formes plus compactes : 'Blaze', 'The Blues'","sources":"Missouri Department of Conservation : https://mdc.mo.gov/discover-nature/field-guide/little-bluestem ; Ohio State University : https://u.osu.edu/plants/?p=371 ; Horticulture Magazine : https://hortmag.com/plants/schizachyrium ; Myriad Botanical Gardens : https://myriad.gardenexplorer.org/taxon-443.aspx ; Utah State University Extension : https://extension.usu.edu/files-ou/publications/publication/HG_Native_Plants_2007-01pr.pdf"},"Sorghastrum nutans":{"statut":"Nom accepté : Sorghastrum nutans (L.) Nash. Basionyme : Andropogon nutans L. ; synonyme Sorghastrum avenaceum (Michx.) Nash","port":"Graminée vivace en touffe, feuillage vers 60 cm, tiges florales de 0,6 à 2,1 m","feuilles":"Vertes à bleu poudré, orangées en automne","fleurs":"Panicule plumeuse dense, d'abord rouge et orangée, puis jaune doré à maturité","floraison":"8 à 10","milieu":"Prairies à hautes herbes et clairières d'Amérique du Nord ; graminée de saison chaude","rusticite":"Zones USDA 4 à 9","usage":"Prairies, massifs, attire les oiseaux ; fourrage apprécié du bétail","entretien":"Plein soleil","sources":"Missouri Department of Conservation : https://mdc.mo.gov/discover-nature/field-guide/indian-grass ; Chicago Botanic Garden : https://www.chicagobotanic.org/plant-collections/plant-finder/sorghastrum-nutans-indian-grass ; FloraFinder (synonymes) : https://florafinder.com/Species/Sorghastrum_nutans.php"},"Sporobolus heterolepis":{"statut":"Nom accepté : Sporobolus heterolepis (A.Gray) A.Gray. Synonymes : Vilfa heterolepis, Agrostis heterolepis","port":"Graminée vivace de saison chaude, en touffe serrée, feuillage de 30 à 60 cm de haut sur 60 à 90 cm de large, ne traçant pas","feuilles":"Longues, très étroites, molles, vert foncé, arquées vers l'extérieur ; dorées à l'automne","fleurs":"Panicule ouverte de 8 à 20 cm sur tige arquée, teintes rose et brun ; épillets à une seule fleur, 3 anthères rougeâtres","floraison":"Fin d'été (fin juillet à mi-septembre)","fruits":"Graine presque ronde de 1,5 à 2 mm, qui se détache de ses glumes à l'automne","milieu":"Prairies à herbes hautes et mi-hautes d'Amérique du Nord","rusticite":"Zones USDA 3 à 9","usage":"Haut d'un jardin de pluie, prairies, rocailles, bords d'allée, alternative à la pelouse","entretien":"Plein soleil, sol moyen à sec et drainé ; lent à s'installer mais très durable ; laisser debout l'hiver et couper à ras au printemps ; se ressème peu","sources":"NC State Extension : https://plants.ces.ncsu.edu/plants/sporobolus-heterolepis/common-name/prairie-drop-seed/ ; Chicago Botanic Garden : https://my.chicagobotanic.org/?p=24714 ; University of Illinois Extension : https://extension.illinois.edu/blogs/grasses-glance/2024-04-09-add-prairie-dropseed-your-home-garden ; Missouri State University : https://ag.missouristate.edu/PBTrewatha/prairie-dropseed.htm ; Emerald Coast Growers (rusticité) : https://ecgrowers.com/blog/drop-everything-sporobolus-heterolepis/"},"Typha latifolia":{"statut":"Nom accepté : Typha latifolia L. (Info Flora)","port":"Vivace aquatique à rhizome, 1 à 2,5 m","feuilles":"Linéaires, 1 à 2 cm de large, raides, dressées, gris-bleuté, sur 2 rangs","fleurs":"Épis cylindriques denses, mâle au-dessus, femelle en dessous, sans espace entre les deux ; fleurs femelles entourées de longs poils","floraison":"6 à 8","fruits":"Petits fruits à soies, dispersés par le vent ; l'épi femelle se défait en flocons à maturité","milieu":"Eaux stagnantes vaseuses jusqu'à 1,5 m, fossés, berges, marais","confusions":"Massette à feuilles étroites (Typha angustifolia) : feuilles de 0,3 à 1 cm, intervalle de 2 à 8 cm entre partie mâle et partie femelle","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/typha-latifolia.html ; Info Flora, T. angustifolia : https://www.infoflora.ch/en/flora/typha-angustifolia.html ; VicFlora (Royal Botanic Gardens Victoria) : https://vicflora.rbg.vic.gov.au/flora/taxon/0e7587fa-9d0a-443e-b3ee-9bbbcef2423a ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/df/65/df6511a9-45da-4565-a099-56323f16e891/typha_latifolia.docx"},"Aruncus dioicus":{"statut":"Nom accepté : Aruncus dioicus (Walter) Fernald (POWO). Synonymes : Aruncus sylvestris, Aruncus vulgaris, Spiraea aruncus","port":"Vivace dressée de 80 à 150 cm (jusqu'à 2 m), souche ligneuse, forte touffe de 90 à 120 cm de large","feuilles":"Alternes, 2 à 3 fois pennées, vert vif, folioles ovales à bord doublement scié ; sans stipules","fleurs":"Panicule de fins épis ; fleurs de 3 mm environ, à 4 à 6 pétales ; mâles et femelles sur des pieds différents","floraison":"6 à 8","fruits":"Follicules ; rares en jardin","milieu":"Forêts fraîches et ombragées, ravins, mégaphorbiaies, bords de ruisseaux","usage":"Ombre à mi-ombre, bord d'eau, sous-bois ; grande vivace de fond de massif","entretien":"Mi-ombre à ombre, sol frais ; reste plus bas en situation ensoleillée ; couper les panicules avant la graine si on ne veut pas de semis ; hybride facilement","sources":"Université d'Innsbruck : https://uibk.ac.at/media/filer_public/a9/78/a978bdc0-fde5-4f55-af21-25de28fdea24/aruncus_dioicus.docx ; BOKU Wien, fiche vivaces : https://boku.ac.at/fileadmin/data/H03000/H85000/H85200/Pflanzenverwendung_Sabine_Plenk/Stauden_Garten_Grundsortiment/Aruncus_dioicus.pdf ; POWO : https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:20973-2 ; iFlora : https://www.i-flora.com/en/fact-sheets/search-for-species/art/show/aruncus-dioicus.html ; Gartenjournal : https://www.gartenjournal.net/geissbart"},"Coreopsis verticillata":{"statut":"Nom correct (RHS) : Coreopsis verticillata L. ; NC State la classe sous Anacis verticillata (nom à surveiller selon la flore utilisée)","port":"Vivace rhizomateuse en touffe de 50 à 80 cm (30 à 90 cm), feuillage léger et aéré","feuilles":"Sessiles, divisées en 3 segments linéaires filiformes disposés en verticille, vert foncé, aromatiques ; teintes bronze ou rouge en automne","fleurs":"Capitules en marguerite de 2 à 5 cm, 8 ligules entières jaune d'or ou jaune citron, disque central jaune ; sur tiges ramifiées","floraison":"6 à 9 (mai à juillet selon NC State)","milieu":"Originaire de l'est du Canada au sud-est des États-Unis (RHS) ; prairies et clairières","rusticite":"RHS H5 ; zones USDA 3 à 9","usage":"Bordures, prairie fleurie, jardin de cottage, sites secs, fleur coupée, plante à insectes","entretien":"Plein soleil ou mi-ombre, sol fertile drainé ; tolère la chaleur et la sécheresse ; couper après la floraison pour une seconde floraison ; s'étale par rhizomes et semis","sources":"RHS : https://rhs.org.uk/plants/4369/coreopsis-verticillata/details ; NC State Extension : https://plants.ces.ncsu.edu/plants/anacis-verticillata/common-name/threadleaf-coreopsis ; Franklin & Marshall College : https://www.fandm.edu/centers-institutes-and-initiatives/sustainability/archive/center-for-the-sustainable-environment/community-resources/native-pollinator-plants/threadleaf-coreopsis-coreopsis-verticillata.html ; Gardenia : https://www.gardenia.net/plant/coreopsis-verticillata ; Cornell Botanic Gardens : https://cornellbotanicgardens.org/?p=17413"},"Dianthus deltoides":{"statut":"Nom accepté : Dianthus deltoides L.","port":"Vivace couchée à dressée de 10 à 30 (40) cm, en touffe lâche","feuilles":"Basales molles, linéaires-oblongues, vert foncé à glauque, 1 à 3 cm ; caulinaires linéaires-aiguës","fleurs":"Rose à pourpre (parfois blanc), 1,5 à 2 cm, points blancs en delta et anneau foncé ; pétales dentés","floraison":"6 à 9","milieu":"Pelouses sablonneuses maigres, talus secs, sols plutôt acides","confusions":"Œillet armérie (Dianthus armeria) : 30 à 60 cm, fleurs en têtes entourées de feuilles, écailles du calice presque aussi longues que le calice","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/dianthus-deltoides.html ; NABU : https://www.nabu.de/tiere-und-pflanzen/pflanzen/pflanzenportraets/wildpflanzen/07750.html ; Flora of New Zealand : https://nzflora.info/factsheet/Taxon/Dianthus-deltoides.html ; iFlora : https://www.i-flora.com/en/fact-sheets/search-for-species/art/show/dianthus-deltoides.html ; Info Flora, D. armeria : https://www.infoflora.ch/en/flora/dianthus-armeria.html"},"Dictamnus albus":{"statut":"Nom accepté : Dictamnus albus L., Rutaceae ; synonyme Dictamnus fraxinella ; nom français Fraxinelle ; Info Flora suisse donne l'espèce comme protégée","port":"Vivace dressée de 60 à 120 cm, racine pivotante, rhizome blanchâtre","feuilles":"Imparipennées à 3 à 11 paires de folioles (5 à 9 selon la plante), ponctuées de glandes à huile, aromatiques (citron) ; semblables à celles d'un frêne","fleurs":"Grappe terminale ; fleurs zygomorphes de 35 à 70 mm, roses (parfois blanchâtres) à nervures rouge foncé ; 4 pétales dirigés vers le haut, 1 vers le bas ; 10 étamines courbées à glandes foncées","floraison":"5 à 6 (fin mai à juin)","fruits":"Capsule déhiscente en 5 parties, explosive, qui projette les graines noires jusqu'à 5 m","milieu":"Lisières thermophiles, buissons clairs, pentes sèches, éboulis et rocailles sur sols calcaires ; plante rare et protégée en Suisse et en Allemagne","sources":"Jardin botanique de l'Université de Berne : https://www.boga.unibe.ch/e534269/e662209/e662214/e667520/Pflanze-des-Monats-Juni-2013.pdf ; Gartenjournal : https://www.gartenjournal.net/zierpflanzen/stauden/diptam ; iFlora : https://www.i-flora.com/en/fact-sheets/phylogenetic-tree/art/show/dictamnus-albus.html ; Austria-Forum : https://austria-forum.org/af/AustriaWiki/Diptam ; Université de Tübingen : https://uni-tuebingen.de/securedl/sdl-eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzAzOTkyNDQsImV4cCI6MTczMDQ4OTI0NCwidXNlciI6MCwiZ3JvdXBzIjpbMCwtMV0sImZpbGUiOiJmaWxlYWRtaW4vVW5pX1R1ZWJpbmdlbi9FaW5yaWNodHVuZ2VuL1plbnRyYWxlX0VpbnJpY2h0dW5nZW4vQm90YW5HYXJ0ZW4vSGlnaGxpZ2h0LzIwMTVfMDZfRGljdGFtbnVzXzFTZWl0ZS5wZGYiLCJwYWdlIjoyOTU1Mn0.gfKyxGCYexlGemKeep7ySnYKBQqXNsabTffgrynS00A/2015_06_Dictamnus_1Seite.pdf"},"Doronicum orientale":{"statut":"RHS : Doronicum orientale (synonyme D. caucasicum). EasyScape, via GBIF, rattache ce nom à Doronicum columnae Ten. : à confirmer sur POWO","port":"Vivace en touffe de 10 à 50 cm sur 50 cm à 1 m de large, caduque","feuilles":"Basales à base en cœur, bord légèrement festonné ; quelques feuilles caulinaires","fleurs":"Capitules isolés jaune d'or de 2,5 à 5 cm, type marguerite, sur tiges fines","floraison":"4 à 6 (mi à fin du printemps)","milieu":"Originaire du sud-est de l'Europe, de la Turquie et du Caucase (RHS)","confusions":"Doronic à feuilles de plantain (D. pardalianches) : plante à tubercules, tiges jusqu'à 90 cm, capitules jaune pâle en groupes lâches","rusticite":"RHS H5","usage":"Massifs de printemps, bord de mer, jardin de cottage","entretien":"Mi-ombre, sol frais, drainé et assez fertile, de préférence sableux ; division au début de l'automne ou semis au printemps","sources":"RHS : https://www.rhs.org.uk/plants/6026/wd/details ; RHS, D. pardalianches : https://rhs.org.uk/Plants/6027/wd/Details ; EasyScape (rattachement à D. columnae) : https://easyscape.com/species/Doronicum-columnae(Leopard%E2%80%99s-Bane)"},"Oenothera speciosa":{"statut":"Nom accepté : Oenothera speciosa Nutt.","port":"Vivace basse, tiges dressées à étalées, 10 à 60 cm","feuilles":"Alternes, lancéolées à oblancéolées, entières, dentées ou pennatifides, nervure médiane blanche","fleurs":"4 pétales roses à blancs, environ 5 cm, en coupe, parfumées ; 8 étamines","floraison":"5 à 7 (jusqu'à 10 au sud des États-Unis)","fruits":"Capsule ovale côtelée","milieu":"Prairies rocailleuses, bords de routes, friches (Amérique du Nord)","usage":"Couvre-sol de sols pauvres et sableux","entretien":"Plein soleil, sol bien drainé ; très envahissante en sol riche, par rhizomes et semis","sources":"US Forest Service, Plant of the Week : https://www.fs.usda.gov/wildflowers/plant-of-the-week/oenothera_speciosa.shtml ; USGS PlantID : https://warcapps.usgs.gov/PlantID/Species/Details/3068 ; Alabama Plant Atlas : https://dev.alabama.plantatlas.usf.edu/plant/species/2785"},"Rodgersia pinnata":{"statut":"Nom accepté (RHS) : Rodgersia pinnata Franch., Saxifragaceae ; la fiche s'appuie surtout sur des cultivars et sur la description du genre","port":"Vivace caduque en touffe à rhizome, 50 cm à 1,5 m de haut sur 50 cm à 1 m de large","feuilles":"Grandes, plus ou moins pennées, folioles jusqu'à 20 cm, ovales, dentées, vert moyen légèrement brillant ; jeunes feuilles bronze","fleurs":"Panicules coniques de petites fleurs en étoile, rose vif à rose pâle ; tiges rouge foncé ; en été","floraison":"6 à 8","milieu":"Berges de ruisseaux et sous-bois ombragés du Yunnan et du Sichuan, en Chine","confusions":"Rodgersia podophylla : feuilles palmées aux lobes déchiquetés jusqu'à 40 cm, fleurs crème ; Rodgersia aesculifolia : feuilles palmées à folioles oblongs","rusticite":"RHS H5 à H6 selon les cultivars","usage":"Bord d'eau, jardin humide, grands massifs d'ombre ; texture architecturale du feuillage","entretien":"Sol profond, riche et toujours frais (jamais détrempé selon la RHS) ; mi-ombre, soleil possible en climat frais avec sol humide ; protéger des vents froids et secs ; division au printemps ; limaces sur les jeunes feuilles","sources":"RHS, cultivar 'Superba' : https://www.rhs.org.uk/plants/70111/rodgersia-pinnata-superba/details ; RHS, cultivar 'Maurice Mason' : https://rhs.org.uk/plants/82667/rodgersia-pinnata-maurice-mason/details ; RHS, cultivar 'Chocolate Wing' : https://www.rhs.org.uk/plants/220836/rodgersia-pinnata-chocolate-wing/details ; RHS, R. podophylla : https://www.rhs.org.uk/Plants/15925/Leucojum-vernum/Details ; RHS, cultivar 'Irish Bronze' : https://www.rhs.org.uk/plants/165759/rodgersia-irish-bronze/details ; Architectural Plants : https://architecturalplants.com/?p=11102"},"Scabiosa columbaria":{"statut":"Nom accepté : Scabiosa columbaria L., Caprifoliaceae (Info Flora)","port":"Vivace de 20 à 80 cm, souvent ramifiée, tige à plusieurs capitules, poilue en haut","feuilles":"Basales le plus souvent entières, ternes, poilues sur les bords et sur les nervures ; supérieures opposées, 1 à 2 fois pennatiséquées","fleurs":"Capitule plat ; corolle lilas à violette, 5 lobes inégaux ; fleurs marginales agrandies","floraison":"6 à 11","milieu":"Pelouses sèches et prairies maigres, sols secs, souvent calcaires et limoneux","confusions":"Knautie (Knautia) : corolle à 4 lobes, 8 à 16 soies au calice, pas de paillettes ; Scabieuse luisante (S. lucida) : 10 à 30 cm, tige souvent simple à un capitule, soies de 5 à 8 mm carénées ; Scabieuse jaunâtre (S. ochroleuca) : fleurs jaune clair, soies brunes","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/scabiosa-columbaria.html ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7703/Scabiosa_columbaria.pdf ; iFlora : https://www.i-flora.com/en/fact-sheets/phylogenetic-tree/art/show/scabiosa-columbaria.html ; Info Flora, S. lucida : https://www.infoflora.ch/de/flora/2184-.html ; Info Flora, S. ochroleuca : https://www.infoflora.ch/en/flora/scabiosa-ochroleuca.html"},"Trollius europaeus":{"statut":"Nom accepté (POWO) : Trollius europaeus L., Ranunculaceae","port":"Vivace de 30 à 60 cm (10 à 120 cm selon les sources), en touffe dressée, hémicryptophyte, racines jusqu'à 40 cm","feuilles":"Palmatiséquées, à segments 3-lobés, grossièrement dentés ; basales rondes et longuement pétiolées, caduques ; glabres","fleurs":"Solitaires ou peu nombreuses, sphériques, 15 à 40 mm, jaune vif ; 10 à 15 pièces du périanthe qui se referment en boule ; nectaires petits ; étamines nombreuses","floraison":"5 à 7","fruits":"Follicules brun foncé à nombreuses graines","milieu":"Prairies humides, bas-marais, mégaphorbiaies, clairières, étage montagnard à subalpin ; Europe jusqu'à la Sibérie occidentale","usage":"Bord d'eau, prairie humide, jardin naturel ; plante indigène protégée dans plusieurs régions ; cultivars 'Lemon Queen' et 'Alabaster' (jaune pâle)","entretien":"Soleil à mi-ombre, sol humide à marécageux, riche, peu drainant ; très rustique, résiste aux fortes gelées ; toxique","sources":"Université d'Innsbruck : https://uibk.ac.at/media/filer_public/f3/33/f3335e49-84c9-4355-a317-cb2f8f24789b/trollius_europaeus.docx ; BOKU Wien, fiche vivaces : https://boku.ac.at/fileadmin/data/H03000/H85000/H85200/Pflanzenverwendung_Sabine_Plenk/Stauden_Garten_Aufbausortiment/Trollius_europaeus_Hybriden.pdf ; POWO : https://powo.science.kew.org/taxon/306789-2 ; iFlora : https://www.i-flora.com/en/fact-sheets/search-for-species/art/show/trollius-europaeus.html ; Plantura : https://www.plantura.garden/blumen-stauden/trollblume/trollblume-pflanzenportrait"},"Pyrus pyraster":{"statut":"Pyrus pyraster (L.) Burgsd. ; traité selon les flores comme espèce ou comme sous-espèce/variété de Pyrus communis. À confirmer sur POWO","port":"Arbre de 2e grandeur jusqu'à 20 m, fût droit et houppier étroit, ou arbuste selon le milieu","feuilles":"Arrondies à brièvement ovales, 2 à 6 cm, dentées, pétiole à peu près aussi long que le limbe","ecorce":"Grise, finement écailleuse, découpée en petites plaques rectangulaires ; rameaux souvent épineux","fleurs":"Blanches ou crème, en ombelles, plus petites que chez le poirier cultivé ; anthères brunes avant maturité","floraison":"4 à 5","fruits":"Rond à légèrement piriforme, 2 à 4 cm, jaune ou brun, jamais rougeaud, dur et riche en cellules pierreuses, mangeable une fois blet","milieu":"Lisières, chênaies claires, haies, bois alluviaux à bois dur ; espèce de lumière","confusions":"Poirier cultivé (Pyrus communis) et ses formes échappées : feuilles plus elliptiques, pas d'épines, fruits plus gros parfois rougeauds. L'hybridation rend la distinction parfois impossible, même pour les spécialistes","sources":"WSL / waldwissen.net : https://www.waldwissen.net/de/lebensraum-wald/naturschutz/artenschutz/wildbirnen-foerdern ; waldwissen.net : https://www.waldwissen.net/de/lebensraum-wald/baeume-und-waldpflanzen/laubbaeume/die-wildbirne-eine-seltene-baumart-mit-wertvollem-holz ; LWF Bayern, G. Aas : https://lfl.bayern.de/mam/cms04/boden-klima/dateien/w23_die_wildbirne_aus_systematisch-botanischer_sicht.pdf ; SDW, Arbre de l'année 1998 : https://www.sdw.de/fileadmin/Bundesverband/01_Dateien/Baum_des_Jahres/1998_Baum_des_Jahres_Wildbirne.pdf"},"Crataegus laevigata":{"statut":"Nom accepté : Crataegus laevigata (Poir.) DC. Synonyme : Crataegus oxyacantha auct.","port":"Arbuste épineux caduc, jusqu'à 5 m","feuilles":"Obovales, base en coin, lobes peu marqués limités au tiers supérieur, bord finement denté","fleurs":"Blanches, parfois roses, sur pédicelles glabres ; 2 ou 3 styles","floraison":"5 à 6","fruits":"Rouges, globuleux, à 2 ou 3 noyaux","milieu":"Haies, lisières, bois de feuillus sur sols frais, riches, souvent argileux ou calcaires","confusions":"Aubépine monogyne (Crataegus monogyna) : 1 style, 1 noyau, feuilles découpées bien au-delà du milieu, pédicelles poilus, stipules à 1 à 8 dents. Les hybrides intermédiaires sont fréquents","sources":"Université de Bayreuth, C. laevigata : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/prog/5001/0/8343/Crataegus_laevigata.pdf ; Université de Bayreuth, C. monogyna : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/prog/5001/0/8344/Crataegus_monogyna,.pdf ; BSBI Plant Crib : https://bsbi.org/learn/resources/plant-crib/crataegus ; Info Flora, C. monogyna : https://www.infoflora.ch/en/flora/crataegus-monogyna.html"},"Rhamnus cathartica":{"statut":"Nom accepté : Rhamnus cathartica L. Synonyme : Rhamnus catharticus","port":"Grand arbuste ou petit arbre caduc, jusqu'à 6 à 7 m, multi-tiges, couronne étalée irrégulière","feuilles":"Subopposées à opposées, parfois alternes ; ovales, finement dentées, 4 à 8 cm, 3 à 4 paires de nervures arquées ; tombent tard sans coloration","ecorce":"Gris-noir à brun, écorce avec lenticelles ; bois jaune, cœur orange ; rameaux souvent terminés par une épine","fleurs":"Petites, vert-jaune, à 4 pétales, parfumées, en groupes de 2 à 6 à l'aisselle des feuilles ; sexes sur pieds séparés","floraison":"5 à 6","fruits":"Drupes noires luisantes de 5 à 8 mm, à 3 ou 4 noyaux ; purgatives (d'où cathartica)","milieu":"Lisières, haies, bois clairs ; plante envahissante en Amérique du Nord","confusions":"Cerisier noir américain (Prunus serotina), à l'état dormant : bourgeons alternes, pas d'épines","sources":"Missouri Department of Conservation : https://mdc.mo.gov/discover-nature/field-guide/common-buckthorn ; NC State Extension : https://plants.ces.ncsu.edu/plants/rhamnus-cathartica/common-name/european-buckthorn ; Minnesota Wildflowers : https://minnesotawildflowers.info/tree/common-buckthorn ; Brooklyn Botanic Garden (NYMF) : https://nymf.bbg.org/species/563 ; NAISN (Invasive.org) : https://www.naisn.org/species/Rhamnus-cathartica"},"Cephalotaxus harringtonia":{"statut":"Nom accepté : Cephalotaxus harringtonia (Knight ex J.Forbes) K.Koch ; famille des Taxacées dans la classification actuelle (NC State)","port":"Arbuste ou petit arbre persistant, 1,5 à 3 m de haut, à peu près aussi large, à texture fine","feuilles":"Aiguilles linéaires aiguës, spiralées chez les jeunes puis sur 2 rangs en V chez les adultes ; deux bandes stomatiques blanchâtres dessous ; aromatiques","fleurs":"Plante dioïque ; paires de carpelles à la face inférieure des rameaux chez les pieds femelles","floraison":"Mars","fruits":"Graine nue puis arille charnu obové de 2 à 3 cm × 5 à 15 mm, olive à brun-pourpre ; non comestible","milieu":"Originaire d'Asie","confusions":"If (Taxus) : feuillage voisin, mais le fruit diffère (World Plants, NC State)","rusticite":"Zones USDA 5 à 9","usage":"Sous-bois et jardin d'ombre, massif ou haie, petits espaces ; alternative aux genévriers","entretien":"Sol frais et drainé, tolère sec, sableux ou argileux ; mieux à l'ombre que la plupart des conifères ; résistant aux cervidés ; toxicité moyenne","sources":"NC State Extension : https://plants.ces.ncsu.edu/plants/cephalotaxus-harringtonia/ ; NC State, cultivar 'Prostrata' : https://plants.ces.ncsu.edu/plants/cephalotaxus-harringtonia-prostrata/common-name/prostrate-japanese-plum-yew/ ; World Plants : https://worldplants.ca/display.php?id=998"},"Helichrysum italicum":{"statut":"Nom accepté : Helichrysum italicum (Roth) G.Don (RHS) ; Helichrysum rupestre : emploi erroné. Sous-espèce serotinum à feuillage plus dense","port":"Sous-arbrisseau persistant de 10 à 50 cm de haut sur 50 à 100 cm de large","feuilles":"Linéaires, gris-argenté, persistantes, curry à la froissure","fleurs":"Petits capitules jaunes en corymbes en dôme, bractées papyracées (fleurs d'immortelle) ; en été","floraison":"6 à 8","milieu":"Rocailles et sables secs du pourtour méditerranéen","confusions":"Lavande (Lavandula) au stade jeune : feuillage gris voisin mais sans odeur de curry","rusticite":"RHS H4 (environ -10 à -5 °C)","usage":"Rocailles, jardins de gravier, bord de mer, cours ; plante à insectes","entretien":"Plein soleil, sol pauvre à modérément fertile, drainé, neutre à alcalin ; craint l'humidité hivernale et les vents froids et secs ; bouturage semi-aoûté en été","sources":"RHS : https://www.rhs.org.uk/plants/34062/wd/details ; RHS, subsp. serotinum : https://www.rhs.org.uk/plants/91924/helichrysum-italicum-subsp-serotinum/details ; World Plants : https://www.worldplants.ca/display.php?id=4641 ; Seedaholic : https://www.seedaholic.com/siol/helichrysum-italicum/"},"Camellia sasanqua":{"statut":"Camellia sasanqua Thunb., Theaceae ; la fiche s'appuie uniquement sur des cultivars et sur la description du genre (pas de page d'espèce RHS retrouvée)","port":"Arbuste persistant buissonnant, 1 à 4 m selon les cultivars, croissance lente","feuilles":"Simples, ovales à elliptiques, coriaces, luisantes, vert foncé, finement dentées ; jeunes feuilles bronze-rouge","fleurs":"Fleurs simples à semi-doubles, parfumées, roses, blanches ou lilas, de 5 à 8 cm, en automne et début d'hiver","floraison":"10 à 12","confusions":"Camélia du Japon (Camellia japonica) : floraison surtout de la fin d'hiver au printemps (la RHS dit « early in the year » pour le genre) ; la floraison d'automne distingue C. sasanqua","rusticite":"RHS H4 ; H4 à H5 selon Gardens Illustrated, protection hivernale possible","usage":"Haie fleurie d'automne, massif de sous-bois acide, bacs (cultivars compacts comme 'Tanya'), fleur coupée","entretien":"Sol acide à neutre, drainé, riche en matière organique ; abri contre les vents froids et secs et contre le soleil du matin, qui abîme boutons et fleurs ; sujet au pourridié, à la phytophthora, à la gale du camélia et à la maladie des feuilles","sources":"RHS, cultivar 'Plantation Pink' : https://rhs.org.uk/Plants/94548/Camellia-sasanqua-Plantation-Pink/Details ; RHS, cultivar 'Tanya' : https://www.rhs.org.uk/plants/97112/camellia-sasanqua-tanya/details ; RHS, cultivar 'Versicolor' : https://rhs.org.uk/plants/270926/camellia-sasanqua-versicolor/details ; RHS, cultivar 'Winter's Snowman' : https://www.rhs.org.uk/plants/528972/camellia-winters-snowman/details ; Gardens Illustrated : https://www.gardensillustrated.com/plants/sasanquas-camellia-plant-guide"},"Actaea simplex":{"statut":"Nom accepté : Actaea simplex (DC.) Wormsk. ex Prantl (RHS). Synonyme très employé : Cimicifuga simplex","port":"Vivace rhizomateuse en touffe, 1 à 1,5 m de haut sur 50 cm à 1 m de large, parfois plus haute selon les cultivars","feuilles":"Composées, finement découpées, trifoliées à pennées, jusqu'à 30 cm ; vert foncé ou pourpre foncé selon les cultivars (groupe Atropurpurea)","fleurs":"Racèmes en goupillon, blanc crème (rosé chez les formes pourpres), parfumés, au-dessus du feuillage","floraison":"8 à 10","fruits":"Baies noires (RHS) ; nocives si ingérées","milieu":"Originaire de Sibérie orientale, Chine de l'Ouest, Mandchourie, Corée et Japon","rusticite":"RHS H7 ; zones USDA 4 à 8","usage":"Massifs d'ombre et de sous-bois, jardin de fleurs d'automne ; fleur coupée","entretien":"Mi-ombre, sol frais et riche, drainé ; ne pas le laisser sécher ; division au début du printemps ; toxique, gants conseillés","sources":"RHS : https://www.rhs.org.uk/plants/165609/wd/details ; NC State Extension : https://plants.ces.ncsu.edu/plants/actaea-simplex/ ; The Bressingham Gardens : https://www.thebressinghamgardens.com/plant-of-the-month/september/ ; Earth.com (synthèse Wikipédia, zones USDA) : https://earth.com/plant-encyclopedia/Angiosperms/Ranunculaceae/actaea-simplex/en/"},"Anthriscus sylvestris":{"statut":"Nom accepté : Anthriscus sylvestris (L.) Hoffm. (Info Flora)","port":"Vivace de 50 à 150 cm, dressée, tige creuse sillonnée","feuilles":"2 à 3 fois pennées, glabres sur les faces et ciliées au bord, avec souvent des touffes de poils blancs aux ramifications ; folioles du bas nettement plus petites","fleurs":"Ombelles composées de 7 à 16 rayons, sans involucre (0 à 2 bractées) ; 4 à 8 bractéoles lancéolées ciliées ; petites fleurs blanches","floraison":"4 à 8","fruits":"Akène (schizocarpe) lisse et glabre de 6 à 10 mm, terminé par un bec de 1 à 2 mm, 10 côtes sur le bec","milieu":"Prairies riches, haies, lisières, bords de chemins, sols frais et nitrophiles","confusions":"Ciguë tachetée (Conium maculatum), très toxique : tige cylindrique, glabre, pruineuse (couche cireuse qui s'efface), souvent tachée de rouge ; la feuille froissée dégage au bout de quelques minutes une odeur nauséabonde. Cerfeuil luisant (A. nitida) : tige glabre ou éparsement poilue, feuilles très luisantes dessous","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/de/flora/anthriscus-sylvestris.html ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7547/Anthriscus_sylvestris.pdf ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/f1/79/f1790380-2afa-407d-9293-d6eefb9aa44b/anthriscus_sylvestris.docx ; Info Flora, A. nitida : https://www.infoflora.ch/en/flora/anthriscus-nitida.html"},"Arabis alpina":{"statut":"Nom accepté : Arabis alpina L. (POWO). La forme cultivée en rocaille est surtout la sous-espèce caucasica (Willd.) Briq.","port":"Vivace de 10 à 40 cm formant des coussins de rosettes","feuilles":"Basales en rosette, oblongues à spatulées, jusqu'à 9 × 3 cm, dentées ; caulinaires (3 à 10) sessiles et embrassantes","fleurs":"Pétales blancs (rarement roses) de 6 à 11 mm (jusqu'à 18 chez la sous-espèce caucasica)","floraison":"4 à 8 dans la nature ; 3 à 4 pour la forme cultivée","fruits":"Silique de 2 à 4 cm (jusqu'à 7), glabre, dressée-étalée","milieu":"Éboulis, rochers, sols calcaires en montagne ; forme cultivée sur murets et rocailles","confusions":"Arabette du Caucase (A. alpina subsp. caucasica), la plante des jardins : entièrement feutrée gris-blanc, 2 à 3 (5) dents par côté de feuille, pétales de 9 à 18 mm, floraison en mars-avril","sources":"POWO (Kew) : https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:277992-1/general-information ; Flora Helvetica via Plazi : https://treatment.plazi.org/id/A2EF3C9A-A430-B545-3CCF-1ECA46FD93D8 ; Info Flora, subsp. caucasica : https://www.infoflora.ch/en/flora/arabis-alpina-subsp-caucasica.html"},"Aubrieta deltoidea":{"statut":"Nom correct (RHS) : Aubrieta deltoidea (L.) DC. Synonyme : Aubrieta intermedia. La plupart des plantes vendues sont des hybrides, regroupés sous Aubrieta × cultorum","port":"Vivace persistante en tapis ou en coussin de 10 cm de haut sur 10 à 50 cm de large, à étalement lent","feuilles":"Petites, ovales, poilues, gris-vert à vert moyen, parfois dentées, persistantes toute l'année","fleurs":"Fleurs à 4 pétales en croix, mauve pâle à violet moyen (hybrides : rose, bleu, rouge-pourpre ou blanc), en courtes grappes","floraison":"4 à 6","fruits":"Silique","milieu":"Originaire des Balkans (RHS)","rusticite":"RHS H6","usage":"Rocailles, murets, talus secs, bacs fleuris au printemps, plante à insectes","entretien":"Plein soleil (ombre légère possible), sol drainé neutre à alcalin ; adapté aux talus calcaires et aux murs ; bouturage tendre ou semi-aoûté, ou semis","sources":"RHS : https://www.rhs.org.uk/Plants/1909/wd/Details ; RHS, Aubrieta × cultorum : https://www.rhs.org.uk/plants/310368/aubrieta-cultorum/details ; RHS, cultivar 'Audrey Purple Shades' : https://www.rhs.org.uk/plants/383613/aubrieta-audrey-purple-shades-audrey-series/details ; RHS, cultivar 'Regado White' : https://www.rhs.org.uk/plants/375942/aubrieta-regado-white/details"},"Caltha palustris":{"statut":"Nom accepté : Caltha palustris L. ; en France : Populage des marais, aussi nommé caltha ou sarbouillotte (e-FLORA-sys)","port":"Vivace palustre de 15 à 30 (50) cm, glabre, tige et rameaux creux","feuilles":"Réniformes à orbiculaires, luisantes, bord crénelé à denté ; stipulées ; basales longuement pétiolées","fleurs":"Jaune d'or (jaune d'œuf), jusqu'à 5 cm, le plus souvent 5 pièces pétaloïdes, nombreuses étamines, pas de nectaires","floraison":"3 à 6 (parfois reprise en septembre)","fruits":"Groupe de follicules à plusieurs graines","milieu":"Prairies humides, fossés, bords de ruisseaux, sources, aulnaies ; sols détrempés, riches en nutriments et en bases","sources":"Université d'Innsbruck : https://uibk.ac.at/media/filer_public/cd/73/cd73eea4-6e21-498a-aecd-15259a1f1686/caltha_palustris.docx ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7562/Caltha_palustris.pdf ; Pladias : https://www.pladias.cz/factsheet/default/5253 ; e-FLORA-sys (nom français) : https://eflorasys.univ-lorraine.fr/index.php/en/species/view/132452 ; Cas clinique d'intoxication (PMC) : https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8601353/"},"Cardamine pratensis":{"statut":"Cardamine pratensis L. ; la flore suisse et Bayreuth la traitent en agrégat de 6 petites espèces (C. pratensis agg.)","port":"Vivace de 20 à 60 cm, sans stolons, à tige creuse","feuilles":"Basales en rosette, impaires-pennées, folioles ronds à réniformes ; caulinaires plus nombreuses, folioles linéaires à oblongs","fleurs":"4 pétales en croix, blanc, lilas ou rose ; 6 étamines de longueurs inégales à anthères jaunes","floraison":"4 à 6","fruits":"Silique étroite et lisse, dressée ; éclate à maturité et projette les graines jusqu'à 2,4 m","milieu":"Prairies humides, aulnaies, bords d'eau, sols frais, riches, parfois tourbeux","confusions":"Plusieurs petites espèces de l'agrégat (par exemple C. dentata : 4 à 12 paires de folioles, anthères de 2 à 2,7 mm) ne se distinguent qu'en détail","sources":"Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7567/Cardamine_pratensis_agg..pdf ; Gartenjournal : https://www.gartenjournal.net/schaumkraut ; Gartenjournal : https://www.gartenjournal.net/wiesenschaumkraut ; Info Flora, C. dentata : https://www.infoflora.ch/en/flora/cardamine-dentata.html"},"Echium vulgare":{"statut":"Nom accepté : Echium vulgare L., Boraginaceae","port":"Bisannuelle dressée de 30 à 100 cm, tige à soies raides, racine pivotante profonde","feuilles":"Rosette basale (jusqu'à 30 cm), puis feuilles de tige étroites, sessiles, à base arrondie, non embrassantes ; toutes rudes","fleurs":"Corolle de 12 à 18 mm, rose en bouton puis bleue (rarement rose ou blanche), 5 lobes, gorge à 2 lèvres ; style bifide au sommet","floraison":"5 à 7 (parfois jusqu'en octobre)","fruits":"4 nucules d'environ 2 mm, anguleuses","milieu":"Friches sèches, ballast, bords de chemins, pelouses sèches ; plante pionnière à racine profonde","confusions":"Buglosse officinale (Anchusa officinalis) : feuilles supérieures toujours embrassantes ; Vipérine faux-plantain (Echium plantagineum) : fleurs de 2 à 3 cm, 2 étamines saillantes, feuilles moins rudes","sources":"Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7601/Echium_vulgare.pdf ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/24/66/2466b77f-5cc7-4317-ae0c-7509db94ccd6/echium_vulgare.docx ; NZPCN : https://nzpcn.org.nz/flora/species/echium-vulgare ; Flora of New Zealand : https://nzflora.info/factsheet/Taxon/Echium-vulgare.html"},"Geum urbanum":{"statut":"Nom accepté : Geum urbanum L. (Info Flora)","port":"Vivace de 25 à 90 cm, tige dressée sans poils glanduleux","feuilles":"Basales interrompues-pennées, foliole terminal grand, 3-lobé, grossièrement denté ; caulinaires 3-lobées ; stipules grandes, dentées","fleurs":"Jaunes, dressées, 1 à 2 cm ; double calice ; pétales étalés, de la longueur des sépales internes","floraison":"5 à 9","fruits":"Akènes en tête globuleuse, terminés par un style coudé en crochet (fruits accrochants)","milieu":"Bois, fourrés, haies, jardins, bords de chemins ; sols frais et riches en azote","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/geum-urbanum.html ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7623/Geum_urbanum.pdf"},"Inula helenium":{"statut":"Nom accepté : Inula helenium L. (Info Flora)","port":"Vivace de 60 à 250 cm, simple ou ramifiée, tige densément poilue","feuilles":"Largement lancéolées, jusqu'à 80 × 20 cm, irrégulièrement dentées, feutrées dessous ; inférieures longuement pétiolées, supérieures embrassantes à base presque en cœur","fleurs":"Capitules jaunes de 6 à 7 cm, isolés ou en panicule lâche ; ligules d'environ 3 cm × 1 à 2 mm ; bractées élargies en spatule jusqu'à 10 mm","floraison":"7 à 8","fruits":"Akène de 4 à 5 mm, glabre, aigrette d'environ 10 mm","milieu":"Lisières, fourrés, friches, souvent échappée des jardins","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/inula-helenium.html"},"Lobelia cardinalis":{"statut":"Nom accepté : Lobelia cardinalis L., Campanulaceae (Missouri Department of Conservation)","port":"Vivace dressée de 60 à 120 cm (jusqu'à 1,5 m), tiges simples ou peu ramifiées","feuilles":"Alternes, 2 à 15 cm, étroitement lancéolées, bord irrégulièrement denté","fleurs":"Grappe terminale de 10 à 40 fleurs d'environ 2,5 cm, rouge cardinal, rarement blanches ou roses","floraison":"7 à 10","fruits":"Capsule côtelée, couronnée des restes du calice","milieu":"Bords de rivières et d'étangs, fossés, forêts alluviales (Amérique du Nord)","rusticite":"Zones USDA 3 à 9","usage":"Bords d'eau, jardins de pluie, massifs frais","entretien":"Sol constamment frais à humide, soleil à mi-ombre ; se multiplie par les rosettes de base","sources":"Missouri Department of Conservation : https://mdc.mo.gov/discover-nature/field-guide/cardinal-flower ; Missouri Plants (S. Turner) : https://missouriplants.com/Lobelia_cardinalis_page.html ; Native Plant Trust : https://plantfinder.nativeplanttrust.org/plant/Lobelia-cardinalis ; USDA NRCS : https://plants.usda.gov/DocumentLibrary/plantguide/pdf/cs_loca2.pdf"},"Lunaria annua":{"statut":"Nom accepté : Lunaria annua L. Synonyme : Lunaria biennis Moench (RHS)","port":"Annuelle ou bisannuelle buissonnante de 50 cm à 1 m","feuilles":"En cœur, triangulaires-ovales, nettement dentées, grandes et rudes","fleurs":"Grappes feuillues de fleurs à 4 pétales, violet-pourpre, rose ou blanc ; fin du printemps et début d'été","floraison":"4 à 6","fruits":"Silicules aplaties, rondes, vertes puis argentées, persistant en hiver","milieu":"Originaire d'Europe du Sud ; non indigène en Grande-Bretagne (RHS)","rusticite":"RHS H6","usage":"Fleur coupée et fleur séchée ; sous-bois frais, ombre claire","entretien":"Plein soleil ou mi-ombre, sol frais et drainé, tout pH ; se ressème abondamment","sources":"RHS : https://www.rhs.org.uk/plants/98034/wd/details ; Wild Letchworth Garden Flora (WLGF) : https://wlgf.org/plants/cultivated-plants-in-the-garden/shade-plants/honesty/"},"Malva moschata":{"statut":"Nom accepté : Malva moschata L.","port":"Vivace dressée de 20 à 80 cm, tige à poils raides","feuilles":"Basales réniformes, peu lobées, crénelées ; caulinaires palmatiséquées en 5 à 7 lanières bi-pennatifides","fleurs":"Pétales roses, rarement blancs, de 2 à 3 cm, échancrés ; calicule de 3 pièces étroites, jusqu'à 5 fois plus longues que larges","floraison":"6 à 9","fruits":"Méricarpes densément velus sur le dos","milieu":"Prairies, bords de chemins, talus, lisières, sols riches sableux ou limoneux","confusions":"Mauve alcée (Malva alcea) : calicule à pièces nettement plus larges, méricarpes glabres, plante plus grande","sources":"Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/prog/5001/0/8400/Malva_moschata.pdf ; Flora of New Zealand (Landcare Research) : https://floraseries.landcareresearch.co.nz/taxa/e9f05213-a99e-45ad-9c0b-8597d2457ade ; iFlora : https://www.i-flora.com/en/fact-sheets/search-for-species/art/show/malva-moschata.html"},"Nuphar lutea":{"statut":"Nom accepté : Nuphar lutea (L.) Sm. (Info Flora)","port":"Plante aquatique vivace à gros rhizome vaseux, feuilles flottantes et fleurs émergées","feuilles":"Flottantes : ovales, coriaces, profondément cordées, 10 à 30 cm ; immergées : minces, translucides, courtement pétiolées","fleurs":"Jaune vif, 4 à 6 cm, dressées hors de l'eau, 5 pièces jaunes (vertes en dehors) qui se recouvrent, nombreuses étamines et petits pétales","floraison":"6 à 9","fruits":"Capsule en forme de bouteille ; stigmate rond à 15 à 20 rayons bruns","milieu":"Eaux calmes ou à courant faible, étangs, lacs, bras morts, canaux, jusqu'à 3 m de profondeur, riches en nutriments","confusions":"Nénuphar nain (Nuphar pumila) : feuilles de 5 à 10 cm, fleurs de 2 à 3 cm ; Nymphéa blanc (Nymphaea alba) : fleurs blanches, 4 sépales, feuilles arrondies avec des liaisons transversales entre les nervures","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/nuphar-lutea.html ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/prog/5001/0/8409/Nuphar_lutea.pdf ; Donau-Auen National Park : https://www.donauauen.at/en/facts/nature-science/flora-engl/yellow-water-lily ; NatureSpot : https://mail.naturespot.org/species/yellow-water-lily ; Info Flora, N. pumila : https://www.infoflora.ch/en/flora/nuphar-pumila.html ; Info Flora, Nymphaea alba : https://www.infoflora.ch/en/flora/nymphaea-alba.html"},"Oenothera biennis":{"statut":"Info Flora traite Oenothera biennis comme un agrégat (O. biennis aggr.) à plusieurs petites espèces, dont O. biennis au sens strict et des hybrides (par exemple O. × fallax) ; la fiche vaut pour l'agrégat","port":"Bisannuelle dressée, 1 à 1,5 m (jusqu'à 2 m), souvent ramifiée, racine pivotante","feuilles":"Rosette la première année ; ensuite alternes, lancéolées, jusqu'à 15 cm, dentées à entières, les basses rétrécies en pétiole, les hautes sessiles ; poils glanduleux","fleurs":"Grappe terminale dressée, multiflore ; 4 pétales jaunes de 2 à 3 cm plus longs que les étamines ; sépales dont les pointes sont accolées à la base en bouton ; fleurs éphémères qui s'ouvrent en quelques minutes ; pollinisation par papillons de nuit et par bourdons le jour","floraison":"6 à 9","fruits":"Capsule étroite de 1,5 à 3 cm de long et 4 à 8 mm d'épaisseur","milieu":"Friches, bords de routes, berges, terrains sablonneux ou caillouteux secs ; originaire d'Amérique du Nord","confusions":"Oenothera biennis au sens strict : tige, calice et fruits sans taches ni stries rouges, pétales de 2 à 3 cm, stigmates ne dépassant pas les étamines ; d'autres petites espèces de l'agrégat montrent des taches rouges ou de plus petites fleurs","sources":"Info Flora, O. biennis aggr. (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/oenothera-biennis-aggr.html ; Info Flora, O. biennis : https://www.infoflora.ch/en/flora/oenothera-biennis.html ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/prog/5001/0/8410/Oenothera_biennis.pdf ; Bionity (Gemeine Nachtkerze) : https://www.bionity.com/de/lexikon/Gemeine_Nachtkerze.html"},"Oxalis acetosella":{"statut":"Nom accepté : Oxalis acetosella L. (POWO)","port":"Vivace à rhizome rampant, 5 à 15 cm, formant des tapis","feuilles":"Basales, à 3 folioles obcordés (en cœur inversé), poilues dessus, bord cilié ; elles se plient en lumière vive","fleurs":"5 pétales blancs (rarement rosés) veinés de violet pourpre, avec une tache jaune à la base ; fleurs ouvertes puis fleurs cléistogames (fermées) au sol","floraison":"4 à 5","fruits":"Capsule de 3 à 4 mm","milieu":"Forêts fraîches, humifères et acides, jusqu'en étage subalpin","sources":"Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7664/Oxalis_acetosella.pdf ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/c0/88/c088882d-75b1-475b-bf95-6b63d161be1d/oxalis_acetosella.docx ; iFlora : https://i-flora.com/en/fact-sheets/search-for-species/art/show/oxalis-acetosella.html ; Gartenjournal : https://www.gartenjournal.net/klee-im-wald"},"Petasites hybridus":{"statut":"Nom accepté : Petasites hybridus (L.) G.Gaertn., B.Mey. & Scherb., Asteraceae","port":"Vivace à stolons, tiges florales de 15 à 40 cm puis jusqu'à 1 m en fruit, pétioles jusqu'à 1,5 m","feuilles":"Basales, très grandes (jusqu'à 60 à 90 cm), en cœur arrondi, à bord inégalement denté, apparaissent après la floraison ; dessous gris-vert, poilu et seulement feutré sur les nervures, tendant à devenir glabre","fleurs":"Capitules de fleurons tubulaires rouges à pourpres en grappe dense, qui s'allonge beaucoup au fruit ; capitules « mâles » de 7 à 8 mm, « femelles » de 3 à 4 mm ; involucre glabre ; plante dioïque, odeur peu agréable","floraison":"3 à 5 (février à mai)","fruits":"Akènes surmontés d'une aigrette blanche et soyeuse","milieu":"Bords de ruisseaux et de rivières, aulnaies, prairies humides, sols mouillés riches en azote, lehmeux ou argileux, de la plaine à 1400 m","confusions":"Tussilage (Tussilago farfara), jeunes feuilles : pétioles à sillon longitudinal net, de section en U, alors que le pétasite n'en a pas ; Pétasite blanc (Petasites albus) : tiges plus basses, fleurs blanchâtres, feuilles plus petites","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/petasites-hybridus.html ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7666/Petasites_hybridus.pdf ; Flora indicativa (Zenodo) : https://zenodo.org/records/10856661 ; Flore du Burren (Naturalis) : https://flora-burren.linnaeus.naturalis.nl/linnaeus_ng/app/views/species/taxon.php?id=38292 ; Outdoor Magazin : https://www.outdoor-magazin.com/wandertipps/gewoehnliche-pestwurz-alle-infos/ ; Altmeyers Enzyklopädie : https://www.altmeyers.org/de/naturheilkunde/pestwurz-gewohnliche-23716 ; Pladias / FloraVeg : https://www.floraveg.eu/factsheet/default/149029"},"Ranunculus repens":{"statut":"Nom accepté : Ranunculus repens L. (POWO synonymise ses variétés prostratus et suberectus sous ce nom)","port":"Vivace de 30 à 60 cm, couchée à arquée, formant de longs stolons feuillés qui s'enracinent","feuilles":"Basales à 3 segments pétiolulés et lobés ; segment central à pétiolule nettement plus long ; pilosité variable, souvent presque glabres","fleurs":"5 pétales jaunes obovales (jusqu'à 30 mm de diamètre) ; sépales appliqués contre la corolle ; pédoncules sillonnés","floraison":"5 à 9","milieu":"Prés humides, fossés, berges, bords de chemins, sols frais, tassés, riches et souvent argileux ; supporte l'inondation","confusions":"Renoncule bulbeuse (R. bulbosus) : base de tige renflée en bulbe et sépales rabattus vers le bas","sources":"Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7693/Ranunculus_repens.pdf ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/24/d6/24d65b49-93f6-4056-8199-7b6038720925/ranunculus_repens.docx ; PlantNET (Sydney) : https://eflora.sydney.edu.au/taxon/ranunculus-repens ; Naturblick (Berlin) : https://naturblick.museumfuernaturkunde.berlin/species/portrait/358?lang=en ; POWO : https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:2926441-4"},"Hyacinthoides non-scripta":{"statut":"Nom accepté : Hyacinthoides non-scripta (L.) Chouard ex Rothm. (nom utilisé par les sources consultées)","port":"Vivace à bulbe de 20 à 50 cm, grappe arquée, jusqu'à environ 20 fleurs","feuilles":"En lanières, lisses, glabres, pointues, 7 à 25 mm de large, jusqu'à 45 cm","fleurs":"Grappe arquée à fleurs d'un seul côté ; cloche étroite à côtés parallèles, bleu-violet profond (parfois blanche ou rose), pointes recourbées ; pollen crème ; parfum sucré","floraison":"4 à 5","milieu":"Sous-bois de feuillus","confusions":"Jacinthe d'Espagne (H. hispanica) : feuilles larges de 20 à 35 mm, tige dressée, fleurs tout autour de la tige, cloche ouverte conique, pollen bleu, sans parfum ; les hybrides (H. × massartiana) sont fréquents et mêlent ces caractères","sources":"Woodland Trust (Woodlands.co.uk) : https://www.woodlands.co.uk/blog/woodland-flowers/blue-flowers/bluebells/ ; The Wildlife Trusts : https://www.wildlifetrusts.org/node/8310 ; Wildlife Insight : https://www.wildlifeinsight.com/?p=5299 ; Lizzie Harper (illustratrice botanique) : https://lizzieharper.co.uk/2018/05/telling-bluebell-species-apart/"},"Scilla siberica":{"statut":"Nom correct (RHS) : Scilla siberica Haw., Asparagaceae","port":"Plante à bulbe formant des touffes de 10 à 20 cm, caduque","feuilles":"3 à 4 par bulbe, en lanières étroites d'environ 15 cm, vert moyen luisant","fleurs":"2 à 5 fleurs (1 à 3 selon World Plants) penchées en cloche ouverte, bleu vif à bleu violet profond, 1,5 cm, anthères bleues ; sur tiges pourpres ; une dizaine de grappes par touffe selon l'âge","floraison":"3 à 5","milieu":"Bois ; originaire de Crimée au nord-ouest de l'Iran (RHS)","rusticite":"RHS H6 ; zones USDA 2 à 8","usage":"Naturalisation sous arbustes caducs et en pelouse, bordures, rocailles, bacs","entretien":"Plein soleil ou mi-ombre, sol drainé tout pH ; planter à 2 à 3 fois la hauteur du bulbe ; couper les fleurs fanées pour limiter le semis ou diviser les touffes en été ; se naturalise très vite ; pourriture du collet possible","sources":"RHS : https://www.rhs.org.uk/plants/16868/wd/details ; RHS Plants (boutique) : https://www.rhsplants.co.uk/plants/_/scilla-siberica/classid.2000008272/ ; World Plants : https://www.worldplants.ca/display.php?id=1259"},"Tanacetum vulgare":{"statut":"Nom accepté : Tanacetum vulgare L.","port":"Vivace dressée de 40 à 150 cm, à rhizome, ramifiée au sommet","feuilles":"Alternes, pennatiséquées (10 à 15 paires de segments dentés ou découpés), glanduleuses, aromatiques","fleurs":"20 à 200 capitules en corymbe compact ; fleurons tous jaunes, les externes sans ligule visible","floraison":"7 à 9","fruits":"Akène de 1 à 2 mm, côtelé, couronne courte en guise d'aigrette","milieu":"Bords de routes, friches, lieux perturbés souvent frais","confusions":"Tanaisie en corymbe (Tanacetum corymbosum) et grande camomille (T. parthenium) : capitules à ligules blanches","sources":"Flora of North America via SEINet : https://biokic4.rc.asu.edu/sandbox/dev/taxa/index.php?taxon=9509 ; Flora of New Zealand : https://nzflora.info/factsheet/Taxon/Tanacetum-vulgare.html ; Flora of the Burren : https://flora-burren.linnaeus.naturalis.nl/linnaeus_ng/app/views/species/taxon.php?id=38560 ; Info Flora, T. corymbosum : https://www.infoflora.ch/en/flora/tanacetum-corymbosum.html ; PlantNET Sydney : https://eflora.library.sydney.edu.au:443/browse/tanacetum/"},"Zantedeschia aethiopica":{"statut":"Nom accepté (RHS) : Zantedeschia aethiopica (L.) Spreng. Synonymes : Calla aethiopica, Richardia africana, Brosimum aethiopica","port":"Vivace en touffe de 50 cm à 1 m (tiges florales jusqu'à 90 cm) sur 10 à 90 cm de large","feuilles":"Dressées, longuement pétiolées, en forme de flèche, vert foncé luisant, 40 à 45 cm ; parfois tachées de blanc chez certaines formes","fleurs":"Spathe blanc pur en entonnoir de 10 à 25 cm, évasée en capuchon, autour d'un spadice jaune de 90 mm portant de minuscules fleurs","floraison":"6 à 9 (fin du printemps à l'été selon le cultivar)","fruits":"Baies orange sur l'épi, à l'automne","milieu":"Originaire d'Afrique australe ; sols marécageux, rives","rusticite":"RHS H4 ; seule espèce de Zantedeschia rustique cultivée en Grande-Bretagne (RHS)","usage":"Bord de bassin, plante de berge (jusqu'à 30 cm d'eau), jardin humide, bacs, fleur coupée","entretien":"Plein soleil ou mi-ombre, sol frais et retenant l'eau ; arroser régulièrement en végétation et très peu en hiver pour les bacs ; abri contre le gel","sources":"RHS : https://www.rhs.org.uk/plants/19190/zantedeschia-aethiopica/details ; RHS, guide de culture : https://www.rhs.org.uk/plants/zantedeschia/growing-guide ; RHS, cultivar 'Crowborough' : https://www.rhs.org.uk/plants/89813/zantedeschia-aethiopica-crowborough/details ; RHS, cultivar 'White Sail' : https://www.rhs.org.uk/plants/69276/zantedeschia-aethiopica-white-sail/details ; World Plants : https://www.worldplants.ca/display.php?id=1264"},"Matteuccia struthiopteris":{"statut":"Nom correct selon la RHS : Matteuccia struthiopteris (L.) Tod., Onocleaceae","port":"Fougère caduque en rosettes de 1 à 1,5 m, qui forme des colonies de 1,5 à 2,5 m de large par stolons","feuilles":"Frondes stériles lancéolées, vert vif, bipennatifides, en couronne ; frondes fertiles plus courtes, brunes, rigides, en perles","fruits":"Frondes fertiles brunes au centre","milieu":"Régions tempérées de l'hémisphère nord, souvent en forêt humide","rusticite":"RHS H5","usage":"Fond de massif d'ombre, bord d'eau, sites très humides, sous-bois ; fougère architecturale","entretien":"Ombre à mi-ombre, sol frais et drainé, acide à neutre, utile en sites très humides ; supprimer les frondes mortes si besoin ; division au printemps ou semis de spores frais","sources":"RHS : https://www.rhs.org.uk/plants/10920/wd/details ; World Plants : https://www.worldplants.ca/display.php?id=1572 ; Van Meuwen : https://www.vanmeuwen.com/p/shuttlecock-fern/V12645vm"},"Opuntia ficus-indica":{"statut":"Nom accepté : Opuntia ficus-indica (L.) Mill. Basionyme : Cactus ficus-indica L. (eFloras / Flora of North America)","port":"Cactus arbustif ou petit arbre de 1,5 à 5 m, la base devenant ligneuse comme un tronc avec l'âge","feuilles":"Feuilles coniques de 3 à 4 mm, très vite caduques ; ce sont les raquettes qui assurent la photosynthèse","fleurs":"5 à 8 cm de diamètre, jaunes (à orangées), portées par les raquettes d'un à deux ans ; floraison printanière, quelques fleurs plus tard","floraison":"Mai à juillet","fruits":"Fruit charnu à pulpe comestible ; peau portant des glochides comme les raquettes","milieu":"Climats semi-arides chauds, type méditerranéen","rusticite":"Zones USDA 9 à 12","usage":"Fruits et jeunes raquettes comestibles (après retrait des glochides) ; fourrage ; maintien des sols","entretien":"Plein soleil, sol sec très drainant ; taille seulement si nécessaire, en coupant à la jonction de deux raquettes","sources":"eFloras (Flora of North America, © Missouri Botanical Garden) reprise par Flora Costaricensis : https://floracostaricensis.myspecies.info/taxonomy/term/25603/descriptions ; University of Arizona Campus Arboretum : https://apps.cals.arizona.edu/arboretum/taxon.aspx?id=891 ; Ruth Bancroft Garden : https://www.ruthbancroftgarden.org/plants/opuntia-ficus-indica/ ; Tropical Forages (fourrage) : https://apps.lucidcentral.org/tropical_forages/pdf/opuntia_ficusindica.pdf"},"Acorus calamus":{"statut":"Nom accepté : Acorus calamus L., seul genre des Acoracées","port":"Vivace des marais à rhizome, 50 à 150 cm, en touffes","feuilles":"Linéaires, en éventail, à base rougeâtre, aromatiques","fleurs":"Spadice de 4 à 10 cm, vert-jaunâtre, en apparence latéral","floraison":"Mai à juillet","fruits":"Rares","milieu":"Rives, roselières, vases, eaux plutôt calcaires ; néophyte naturalisé en Europe","confusions":"Iris des marais (Iris pseudacorus) : longtemps confondu avec l'acore ; ses grandes fleurs jaunes et son absence d'odeur aromatique le distinguent","sources":"iFlora (Quelle & Meyer) : https://www.i-flora.com/en/fact-sheets/phylogenetic-tree/art/show/acorus-calamus.html ; NParks Singapour, Flora & Fauna Web : https://www.nparks.gov.sg/florafaunaweb/flora/3/4/3491"},"Butomus umbellatus":{"statut":"Nom accepté : Butomus umbellatus L., seul genre des Butomacées (Info Flora, Flora of North America)","port":"Vivace aquatique enracinée dans la vase, à rhizome, 60 à 150 cm, tiges et feuilles émergées","feuilles":"Basales, linéaires, jusqu'à 1,5 m × 1 cm, à 3 angles à la base, planes seulement au sommet, souvent tordues","fleurs":"Ombelle terminale entourée de bractées ; fleurs de 2 à 2,5 cm, 6 tépales sur 2 rangs, 9 étamines, 6 carpelles","floraison":"6 à 8","fruits":"6 follicules","milieu":"Bords d'eaux calmes ou lentes, rivières, canaux, étangs","confusions":"Flûteau graminoïde (Alisma gramineum) : Flora Helvetica renvoie à cette espèce pour les feuilles rubanées ; c'est l'ombelle rose qui tranche","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/butomus-umbellatus.html ; Flora of the Burren (Naturalis) : https://flora-burren.linnaeus.naturalis.nl/linnaeus_ng/app/views/species/taxon.php?id=37751 ; Flora of North America via NEON : https://biorepo.neonscience.org/portal/taxa/index.php?taxon=9270 ; Pladias : https://pladias.cz/en/factsheet/default/1899"},"Centaurea montana":{"statut":"Nom accepté : Centaurea montana L., Asteraceae","port":"Vivace buissonnante à en touffe de 20 à 80 cm (45 cm sur 60 cm en culture), tiges poilues","feuilles":"Alternes, ovales à oblongues-lancéolées, 7 à 18 cm, entières ou à peine dentées, gris-vert ; basales pétiolées et ailées, supérieures sessiles et décurrentes","fleurs":"Capitule le plus souvent solitaire, sans ligules ; 10 à 20 fleurons marginaux stériles bleu royal, de 2,5 à 4,5 cm et profondément lobés ; fleurons du centre pourpres à anthères bleu-pourpre ; bractées à marge brun-noir déchiquetée","floraison":"5 à 7 (début d'été en culture ; jusqu'en septembre selon une flore américaine)","milieu":"Prairies et bois des montagnes d'Europe centrale et méridionale","confusions":"Centaurée des bois (Centaurea nemoralis) : fleurs pourpres à fleurons marginaux à peine agrandis, bractées à appendices noirs frangés en peigne","usage":"Bordures, jardin de cottage, zones naturalisées ; fleur coupée","entretien":"Soleil ou mi-ombre, sol frais mais drainé, évite les sols riches ; supporte la sécheresse ; couper les tiges à ras après la floraison pour une refloraison tardive ; division tous les 2 à 3 ans","sources":"Colorado Wild Buds (d'après Flora of Colorado et Flora of North America) : https://coloradowildbuds.com/centaurea-montana.html ; Gartenjournal : https://www.gartenjournal.net/zierpflanzen/stauden/flockenblume/berg-flockenblume ; Provender Nurseries : https://www.provendernurseries.co.uk/factsheets/centaurea-montana ; Gardeners' World : https://gardenersworld.com/plants/centaurea-montana ; Flora indicativa (Zenodo), C. nemoralis : https://zenodo.org/records/10856625"},"Buphthalmum salicifolium":{"statut":"Nom accepté : Buphthalmum salicifolium L. (World Flora Online, wfo-0000082220)","port":"Vivace de 30 à 70 cm","feuilles":"Feuilles lancéolées","fleurs":"Capitules jaunes de 4 à 6 cm","floraison":"Juin à septembre","confusions":"Inule à feuilles de saule (Inula salicina), de port très semblable : ses ligules ne font qu'environ 1 mm de large, critère de distinction donné par Flora Helvetica","sources":"World Flora Online : https://list.worldfloraonline.org/wfo-0000030772 ; Info Flora, fiche Inula salicina : https://www.infoflora.ch/en/flora/inula-salicina.html"},"Aster amellus":{"statut":"Nom accepté : Aster amellus L. (Info Flora) ; nom français Aster amelle, Aster des Alpes de plaine ; plante « Berg-Aster » en allemand","port":"Vivace de 20 à 60 cm, tiges dressées, ramifiées en haut","feuilles":"Alternes, étroitement ovales à lancéolées, entières ou grossièrement dentées, rudes ; basses pétiolées, hautes sessiles","fleurs":"Capitules de 2 à 3 cm (jusqu'à 5 cm selon iFlora), disque jaune et ligules bleu-lilas ; bractées de l'involucre à peu près égales","floraison":"6 à 9 (jusqu'à fin d'été et début d'automne selon les sources)","fruits":"Akène avec aigrette d'environ 5 mm, jaunâtre puis blanc argenté","milieu":"Pentes caillouteuses calcaires, lisières, pelouses sèches ; plante de plein soleil et de sols secs","confusions":"Aster des Alpes (A. alpinus) : capitule solitaire de 3 à 4,5 cm, tige de 5 à 20 cm","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/aster-amellus.html ; BOKU Wien, fiche vivaces : https://boku.ac.at/fileadmin/data/H03000/H85000/H85200/Pflanzenverwendung_Sabine_Plenk/Stauden_Garten_Aufbausortiment/Aster_amellus.pdf ; iFlora : https://www.i-flora.com/en/the-smartphone-apps/iflora-deutschland/species/art/show/aster-amellus-1.html ; Pladias / FloraVeg : https://floraveg.eu/factsheet/default/140971 ; Info Flora, A. alpinus : https://www.infoflora.ch/en/flora/aster-alpinus.html"},"Bryonia dioica":{"statut":"Nom accepté : Bryonia dioica Jacq. Synonymes : Bryonia cretica subsp. dioica, Bryonia sicula (INRAE)","port":"Liane herbacée vivace jusqu'à 4 à 5 m, tige mince, racine tubéreuse très grosse, la partie aérienne disparaît en hiver","feuilles":"Palmatilobées à 5 lobes, 5 à 7 cm, cordées à la base, dentées-sinuées, poils courts raides ; pétiole portant une vrille à sa base","fleurs":"Verdâtres à blanc verdâtre, veinées, jusqu'à 18 à 20 mm ; fleurs mâles à pédoncules plus longs que les femelles","floraison":"5 à 9","fruits":"Baie globuleuse lisse de 5 à 8 mm, rouge à maturité, à sève fétide","milieu":"Haies, lisières, buissons, bois clairs, souvent sur sols calcaires","confusions":"Bryone blanche (Bryonia alba) : baies noires, plante monoïque","sources":"iFlora : https://www.i-flora.com/en/the-smartphone-apps/iflora-deutschland/species/art/show/bryonia-dioica-1.html ; INRAE Dijon (HYPPA) : https://www2.dijon.inrae.fr/hyppa/hyppa-a/byodi_ah.htm ; Flore historique (Düsseldorf) : https://lessing.ub.uni-duesseldorf.de/download/pdf/2414101.pdf ; UK South West Wildflowers : https://ftp.uksouthwest.net/wildflowers/cucurbitaceae/bryonia-dioica.html"},"Vitis coignetiae":{"statut":"Nom accepté : Vitis coignetiae Pulliat ex Planch. (RHS)","port":"Liane caduque de 15 m, jusqu'à 20 m selon les sources, étalement de 2,5 à 5 m","feuilles":"Largement en cœur, légèrement 3 à 5 lobées, jusqu'à 30 cm de long, brun-roux feutrées dessous, écarlate à cramoisi en automne","fleurs":"Minuscules, verdâtres, en mai-juin, discrètes","floraison":"5 à 6","fruits":"Petites baies bleu-noir de 1 cm en grappes ; non comestibles selon Future Forests ; nocives pour les chiens (RHS)","milieu":"Originaire du Japon","rusticite":"RHS H5 (Future Forests : rustique)","usage":"Habiller un mur ou un grand arbre ; support solide indispensable (un treillage léger ne suffit pas)","entretien":"Plein soleil ou mi-ombre, sol drainé neutre à alcalin, exposition sud ou ouest abritée ; marcottage à l'automne ou boutures de bois en fin d'hiver","sources":"RHS : https://www.rhs.org.uk/plants/19030/wd/details ; Future Forests : https://futureforests.ie/products/vitis-coignetiae ; Ashridge Trees : https://ashridgetrees.co.uk/p/climbing-plants/crimson-glory-vine-vitis-coignetiae"},"Ficus pumila":{"statut":"Nom accepté : Ficus pumila L. Synonymes : Ficus repens hort., Ficus stipulata, Ficus longipedicellata","port":"Grimpante persistante, murs et troncs ; deux stades très différents, juvénile fin et plaqué, adulte à rameaux ligneux horizontaux","feuilles":"Juvéniles : cordées obliques, pointues, 2 à 3 cm, fines et gaufrées. Adultes : ovales à base en cœur, coriaces, 4 à 9 cm","fleurs":"Petites, vert-jaune, présentes seulement sur les rameaux adultes","fruits":"Figues piriformes à cylindriques, d'environ 6 cm, vertes puis brun foncé, seulement sur les rameaux adultes","milieu":"Originaire de Chine, du Japon et du Vietnam","confusions":"Lierre (Hedera) : même stratégie de crampons, mais feuilles en général lobées ; le figuier rampant est un Moracée, parent du mûrier","rusticite":"Zones USDA 8 à 11 (ASU) ; un pied cultivé contre un mur sud dans le Sussex depuis environ 70 ans (Trees and Shrubs Online)","usage":"Couverture de murs maçonnés, treillis, topiaire ; ne s'accroche pas au plastique","entretien":"Ombre à mi-soleil ; arrosage régulier ; très envahissant, ses crampons abîment le bois : couper les rameaux adultes qui s'écartent du support pour garder le feuillage juvénile","sources":"Trees and Shrubs Online : https://www.treesandshrubsonline.org/articles/ficus/ficus-pumila/ ; NC State Extension : https://plants.ces.ncsu.edu/plants/all/ficus-pumila/ ; Arizona State University (Plant Library) : https://www.asu.edu/lib/camartin/plants/Plant%20html%20files/ficuspumila.html ; Burke's Backyard : https://www.burkesbackyard.com.au/fact-sheets/in-the-garden/climbers/creeping-fig/"},"Briza media":{"statut":"Nom accepté : Briza media L. (Info Flora)","port":"Graminée vivace de 20 à 50 (90) cm, en touffe lâche à courts rhizomes","feuilles":"2 à 5 mm de large, rudes au bord, mates dessus et un peu luisantes dessous ; ligule d'environ 1 mm","fleurs":"Panicule lâche et étalée ; épillets arrondis ou en cœur suspendus à des pédicelles fins ; glumes et lemmes sans arête, à large bord scarieux","floraison":"5 à 8","milieu":"Prairies et pâturages maigres, secs à frais, bois clairs ; indicateur de milieu pauvre","confusions":"Grande brize (Briza maxima) : espèce méditerranéenne à épillets nettement plus grands, utilisée comme graminée ornementale","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/briza-media.html ; Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/prog/5001/0/8309/Briza_media,.pdf ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/3c/c2/3cc27729-9758-41a9-80b8-ce6bf19fe33c/briza_media.docx ; Flora of New Zealand : https://www.nzflora.info/factsheet/taxon/Briza-media.html ; Spektrum, Lexikon der Biologie : https://www.spektrum.de/lexikon/biologie/zittergras/71831"},"Dactylis glomerata":{"statut":"Nom accepté : Dactylis glomerata L. (Kew GrassBase)","port":"Graminée vivace en touffe dense et grossière, 25 à 120 cm, tiges comprimées","feuilles":"2 à 14 mm de large, pliées dans le bourgeon puis planes, nervure médiane forte, rudes sur les bords ; gaine carénée","fleurs":"Panicule contractée, unilatérale, 2 à 30 cm, à paquets d'épillets serrés en pelote au bout des rameaux ; épillets de 5 à 9 mm, 2 à 5 fleurs","floraison":"Mai à juillet","milieu":"Prairies, pâtures, bords de chemins","sources":"Kew GrassBase : https://www.kew.org/data/grasses-db/www/imp02702.htm ; Flora of New Zealand : https://nzflora.info/factsheet/Taxon/Dactylis-glomerata.html ; DELTA, genres de graminées : https://www.delta-intkey.com/grass/www/dactylis.htm ; Herbiguide : https://www.herbiguide.com.au/Descriptions/hg_Cocksfoot.htm"},"Helictotrichon sempervirens":{"statut":"Nom correct (RHS) : Helictotrichon sempervirens (Vill.) Pilg. Synonymes : Avena sempervirens, Avena candida","port":"Graminée vivace en touffe dense, persistante ou semi-persistante, 1 à 1,5 m en fleur sur 50 cm à 1 m de large","feuilles":"Linéaires, raides, un peu piquantes, bleu-gris à bleu acier, pruineuses, persistantes","fleurs":"Panicules ouvertes d'épillets de couleur paille à brun clair, sur tiges grêles et dressées, au-dessus de la touffe","floraison":"6 à 8","milieu":"Prairies sèches et rocailles du sud-ouest de l'Europe","rusticite":"RHS H5 ; zones USDA 4 à 8","usage":"Bord de mer, massifs architecturaux, bordures, jardin à faible entretien","entretien":"Plein soleil, sol pauvre à moyennement fertile, drainé, neutre à alcalin ; retirer le feuillage mort et les vieilles tiges florales au printemps ou peigner la touffe ; division à la mi-printemps ; rouille possible","sources":"RHS : https://www.rhs.org.uk/plants/8555/wd/details ; World Plants : https://worldplants.ca/display.php?id=3669 ; University of Florida (IFAS) : https://edis.ifas.ufl.edu/publication/FP251/pdf ; Botanix : https://botanix.com/en/products/helictotrichon-sempervirens-blue-oat-grass ; Wayside Gardens : https://www.waysidegardens.com/products/helictotrichon-sempervirens-27908"},"Koeleria glauca":{"statut":"Nom accepté : Koeleria glauca (Spreng.) DC. selon POWO (souvent cité « (Schrad.) DC. »). Synonymes : Aira glauca, Koeleria pyrenaica","port":"Vivace en touffe dense, tiges de 10 à 45 (60) cm","feuilles":"Enroulées, 2 à 5 cm × 1 à 2 mm, raides, glauques, rudes ; ligule membraneuse d'environ 1 mm","fleurs":"Panicule spiciforme linéaire, interrompue, 2 à 11 cm sur 0,8 cm ; axe et rameaux poilus ; épillets de 4 à 5 mm, 2 ou 3 fleurs","floraison":"5 à 7","milieu":"Pelouses sèches et sableuses","confusions":"Koelérie du Valais (Koeleria vallesiana) : gaines de base décomposées en un réseau de fibres dense autour de la tige, feuilles de moins de 1 mm","sources":"POWO (Kew) : https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:406559-1/general-information ; Kew GrassBase : https://www.kew.org/data/grasses-db/www/imp05847.htm ; Pladias : https://pladias.cz/en/factsheet/default/3122 ; Info Flora, K. vallesiana : https://www.infoflora.ch/en/flora/koeleria-vallesiana.html"},"Leymus arenarius":{"statut":"Nom accepté : Leymus arenarius (L.) Hochst. Synonyme : Elymus arenarius L. (POWO, RHS)","port":"Vivace de 60 à 150 (200) cm, en touffes lâches qui s'étendent fortement par rhizomes","feuilles":"Planes ou enroulées, 20 à 60 cm × 8 à 22 mm, glauques, rudes et nervurées dessus, pointe dure","fleurs":"Épi de 15 à 35 cm, bleu-gris puis paille ; épillets de 20 à 32 mm, 3 à 6 fleurs, groupés par 2 ; tout l'été","floraison":"Juillet à août","milieu":"Sables mobiles des dunes littorales","rusticite":"RHS H7 (très rustique)","usage":"Sols sableux ou drainés, plein soleil, bord de mer ; résiste à la sécheresse et au sel","entretien":"Très envahissant par ses rhizomes ; couper le feuillage à l'automne, diviser au printemps","sources":"RHS : https://www.rhs.org.uk/Plants/43006/wd/Details ; POWO (Kew) : https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:407309-1/general-information ; Kew GrassBase : https://www.kew.org/data/grasses-db/www/imp05979.htm ; NC State Extension : https://plants.ces.ncsu.edu/plants/leymus-arenarius/common-name/european-dune-grass/"},"Lolium perenne":{"statut":"Nom accepté : Lolium perenne L. (Info Flora, Kew GrassBase)","port":"Vivace en touffes vert foncé, 20 à 70 cm","feuilles":"2 à 4 (6) mm de large, pliées en long dans le bourgeon, face inférieure glabre et luisante ; ligule de 0,5 à 2 mm ; oreillettes discrètes ou absentes","fleurs":"Épi jusqu'à 20 (28) cm ; épillets de 6 à 15 mm, 5 à 9 fleurs ; glume unique plus courte que l'épillet ; lemmes sans arête","floraison":"5 à 10","milieu":"Pelouses, chemins, prés pâturés : résiste au piétinement","confusions":"Chiendent rampant (Elymus repens) : épillets appliqués par la face, 2 glumes ; Ray-grass d'Italie (Lolium multiflorum) : feuilles vert clair jusqu'à 1 cm, roulées dans le bourgeon, lemmes à arête jusqu'à 15 mm","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/lolium-perenne.html ; Info Flora, L. multiflorum : https://www.infoflora.ch/en/flora/lolium-multiflorum.html ; Kew GrassBase : https://www.kew.org/data/grasses-db/www/imp06037.htm ; Flora of New Zealand : https://www.nzflora.info/factsheet/taxon/Lolium-perenne.html ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/bd/34/bd3458f6-31d1-43b3-af49-8a2d07461470/lolium_perenne.docx"},"Pseudosasa japonica":{"statut":"Nom correct (RHS) : Pseudosasa japonica (Siebold & Zucc. ex Steud.) Makino ex Nakai. Synonymes : Arundinaria japonica, Bambusa metake, Sasa japonica","port":"Bambou persistant, chaumes de 3 à 5 m (RHS jusqu'à 6 m) et 1 à 2,5 cm de diamètre, en fourré dense","feuilles":"Persistantes, 15 à 35 cm de long sur 1,5 à 5 cm de large, brillantes dessus, glauques dessous ; 3 à 7 par rameau","ecorce":"Chaume vert foncé à olive, marqué d'un anneau blanc sous les nœuds ; gaines vert à vert-pourpre, très pâles avec l'âge, persistantes","fleurs":"Panicules vertes à brunâtres, parfois violacées, qui peuvent apparaître à n'importe quel moment de l'année ; la floraison est rare","floraison":"Rare ; sans saison fixe","milieu":"Originaire du Japon et de Corée","confusions":"Bambous à gaines caduques (par exemple Phyllostachys) : les gaines tombent quand les chaumes arrivent à maturité, alors qu'elles persistent chez Pseudosasa","rusticite":"RHS H5 ; zones USDA 7 à 10","usage":"Haie brise-vent ou écran, sites ombragés, venteux ou littoraux, grands bacs","entretien":"Sol riche, drainé mais frais ; arrosage régulier surtout à la reprise et en été ; supporte l'ombre ; protéger des vents froids et secs ; couper rapidement les pousses en fleur ; barrière anti-rhizomes conseillée ; rhizomes faibles et peu profonds, qu'on coupe à la bêche en avril-mai","sources":"RHS : https://www.rhs.org.uk/plants/14080/wd/details ; Flora of New Zealand (Landcare Research) : https://nzflora.info/factsheet/taxon/Pseudosasa-japonica.html ; Florida Natural Areas Inventory : https://www.fnai.org/species-communities/invasives/invasives-print?ID=193 ; Université de Kyoto, clé des bambous : https://repository.kulib.kyoto-u.ac.jp/server/api/core/bitstreams/f768a52d-c1cb-4ccf-9c5e-90d579b149f1/content ; Bamboo Garden : https://www.bamboogarden.com/bamboo/pseudosasa-japonica ; Ashridge Trees : https://www.ashridgetrees.co.uk/p/shrubs/bamboo/arrow-pseudosasa-japonica-metake ; Tropical Britain : https://www.tropicalbritain.co.uk/pseudosasa-japonica1.html"},"Elymus repens":{"statut":"Nom accepté : Elymus repens (L.) Gould. Synonymes : Elytrigia repens (L.) Desv. ex Nevski, Agropyron repens (L.) P.Beauv., Triticum repens L. (Kew GrassBase, Info Flora)","port":"Vivace de 30 à 120 (150) cm, en peuplements lâches grâce à de longs rhizomes","feuilles":"Limbe plat, 3 à 10 (12) mm de large, rude au bord et dessous ; oreillettes en faucille ; ligule membraneuse de 0,3 à 1 mm","fleurs":"Épi de 5 à 20 cm ; épillets de 10 à 20 mm, à 3 à 8 fleurs ; glumes presque égales, pointues, parfois aristées (arête plus courte que la lemme)","floraison":"Juin à août","milieu":"Lieux cultivés et jardins, friches, prairies non pâturées, haut de plage ; ne supporte ni pâturage ni fauche répétée","confusions":"Ivraie vivace (Lolium perenne) : épillets placés par la tranche contre l'axe","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/elymus-repens.html ; Kew GrassBase : https://www.kew.org/data/grasses-db/www/imp03563.htm ; Flora of Northern Ireland (milieux) : https://www.habitas.org.uk/flora/species.asp?item=2595"},"Holcus lanatus":{"statut":"Nom accepté : Holcus lanatus L. (Kew GrassBase)","port":"Graminée vivace en touffe, 20 à 80 (120) cm, presque sans stolons","feuilles":"Limbes de 3 à 10 mm, pubescents des deux côtés, jusqu'à veloutés ; gaines poilues ; ligule d'environ 1 à 3 mm, poilue au dos","fleurs":"Panicule lancéolée à ovale, dense ou lâche, de 7 à 14 cm (jusqu'à 18) ; épillets de 4 à 6 mm, 1 fleur fertile et 1 fleur réduite","floraison":"6 à 8","milieu":"Prés et pâtures frais à humides, tourbières basses, bois clairs ; sols riches, pauvres en calcaire ; peu consommée par le bétail","confusions":"Houlque molle (Holcus mollis) : stolons souterrains, nœuds seuls à poils en couronne, limbes rudes, arête genouillée dépassant la glume d'environ un tiers","sources":"Université de Bayreuth : https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7628/Holcus_lanatus.pdf ; Université d'Innsbruck : https://uibk.ac.at/media/filer_public/d7/43/d74376f8-56b6-427e-a210-0032dd88876f/holcus_lanatus.docx ; Kew GrassBase : https://www.kew.org/data/grasses-db/www/imp05400.htm ; Info Flora, H. mollis : https://www.infoflora.ch/en/flora/holcus-mollis.html ; Flora of New Zealand : https://nzflora.info/factsheet/Taxon/Holcus-lanatus.html"},"Schoenoplectus lacustris":{"statut":"Nom accepté : Schoenoplectus lacustris (L.) Palla. Synonyme : Scirpus lacustris L. Certains auteurs rattachent S. tabernaemontani comme sous-espèce","port":"Vivace aquatique à rhizome formant des peuplements denses, tiges hautes et vertes","feuilles":"Tiges rondes vertes, feuilles réduites","fleurs":"Épillets bruns en grappe à l'apparence latérale près du sommet de la tige ; glumes lisses ; 3 stigmates","floraison":"Juin à août","fruits":"Akène au moins obtusément trigone","milieu":"Eaux douces : bords de lacs, étangs et rivières","confusions":"Scirpe de Tabernaemontanus (S. tabernaemontani) : 30 à 60 cm plus bas, tiges glauques, glumes couvertes de petites papilles brun foncé, 2 stigmates, akène biconvexe. Taille et couleur ne suffisent pas : vérifier l'inflorescence","sources":"BSBI Plant Crib : https://bsbi.org/learn/resources/plant-crib/schoenoplectus"},"Cyperus longus":{"statut":"Nom accepté : Cyperus longus L.","port":"Vivace à rhizome traçant, 50 à 150 cm","feuilles":"Basales, presque aussi longues que la tige ; gaines basales blanches à rouges","fleurs":"Ombelle composée ; épillets plats, brun-rouge luisant, carène verte ; 3 stigmates","floraison":"5 à 8","fruits":"Akène trigone, brun-rouge à noirâtre","milieu":"Zones humides : bords d'eau, prairies inondables, sur sol plutôt calcaire","sources":"Info Flora (Flora Helvetica 2018) : https://www.infoflora.ch/en/flora/cyperus-longus.html ; Flora of New
